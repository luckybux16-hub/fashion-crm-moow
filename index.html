    function welcomePanel(user, mine, visible, overdue, soon) {
      const roleText = roleWelcome(user.role);
      const firstAction = mine[0];
      return `
        <section class="panel welcome-panel">
          <div class="welcome-copy">
            <span class="brand-kicker">${escapeHtml(dayGreeting())}</span>
            <h2>${escapeHtml(user.name)}, ${escapeHtml(roleText.title)}</h2>
            <p class="muted">${escapeHtml(roleText.text)}</p>
            <div class="focus-strip">
              <span class="pill ok">${mine.length} задач на вас</span>
              <span class="pill ${overdue ? "danger" : "ok"}">${overdue} срочно</span>
              <span class="pill ${soon ? "warn" : "ok"}">${soon} скоро дедлайн</span>
              <span class="pill">${visible.filter(m => unreadCount(m)).length} с новыми комментариями</span>
            </div>
            ${firstAction ? `<div class="focus-card"><strong>Начать можно с: ${escapeHtml(firstAction.title || "Без названия")}</strong><span class="muted">${escapeHtml(firstAction.status)} · дедлайн ${escapeHtml(firstAction.deadline || "не задан")}</span></div>` : `<div class="focus-card"><strong>Сейчас на вас нет зависших задач</strong><span class="muted">Можно спокойно посмотреть все модели или новые комментарии.</span></div>`}
          </div>
          <div class="mood-board" aria-hidden="true">
            <div class="mood-tile">Идея</div>
            <div class="mood-tile">Лекала</div>
            <div class="mood-tile">Образец</div>
            <div class="mood-tile">Правки</div>
            <div class="mood-tile">Цех</div>
            <div class="mood-tile">Финал</div>
          </div>
        </section>
      `;
    }

    function dayGreeting() {
      const hour = new Date().getHours();
      if (hour < 6) return "Доброй ночи";
      if (hour < 12) return "Доброе утро";
      if (hour < 18) return "Добрый день";
      return "Добрый вечер";
    }

    function roleWelcome(role) {
      role = normalizeRole(role);
      if (isAdminRole(role)) return { title: "система под контролем", text: "Сверху видны доступы, резервные копии и состояние базы. Рабочие модели остаются на виду." };
      if (isOwnerRole(role)) return { title: "сегодня держим разработку в ритме", text: "Здесь собраны модели, где нужно принять решение, передать задачу или проверить результат." };
      if (isConstructorRole(role)) return { title: "ваши лекала и корректировки собраны здесь", text: "CRM показывает только задачи, где сейчас ожидается ваша работа или финальная отметка." };
      if (isWorkshopRole(role)) return { title: "ваши образцы ждут аккуратного финиша", text: "На дашборде видны модели, которые сейчас находятся на отшиве или сдаче образца." };
      return { title: "приятной работы", text: "Все нужные задачи и модели собраны на этом экране." };
    }

    function allView() {
      return `
        <section class="panel">
          <div class="toolbar">
            <div>
              <h2>Все модели</h2>
              <p class="muted">Короткие карточки моделей. Детали открываются по клику.</p>
            </div>
            <div class="filters">
              <input id="modelSearch" type="search" value="${escapeAttr(state.allSearch || "")}" placeholder="Поиск">
              <button class="${state.allFilter === "process" ? "dark" : ""}" data-filter="process">В процессе</button>
              <button class="${state.allFilter === "archive" ? "dark" : ""}" data-filter="archive">Архив</button>
              <button class="${state.allFilter === "all" ? "dark" : ""}" data-filter="all">Все</button>
              <select id="responsibleFilter">
                <option value="">Все ответственные</option>
                ${state.users.filter(u => u.active).map(u => `<option value="${u.id}" ${state.allResponsibleFilter === u.id ? "selected" : ""}>${escapeHtml(u.name)}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="card-grid">${allModels().map(modelCard).join("") || `<div class="empty">Модели не найдены</div>`}</div>
        </section>
      `;
    }

    function globalStatsView() {
      if (!canViewGlobalStats()) return `<section class="panel"><div class="empty">Нет доступа</div></section>`;
      const models = modelsForStatsPeriod();
      const allPeriodModels = modelsForStatsPeriod(true);
      const inWork = allPeriodModels.filter(m => !isDeleted(m) && inProcess(m));
      const released = allPeriodModels.filter(m => m.status === "Завершено");
      const deleted = allPeriodModels.filter(isDeleted);
      const heaviest = heaviestModel(allPeriodModels);
      const constructorTotal = models.reduce((sum, m) => sum + constructorCostTotal(m), 0);
      const workshopTotal = models.reduce((sum, m) => sum + m.samples.filter(s => s.readyAt).reduce((s, sample) => s + Number(sample.cost || 0), 0), 0);
      const fabricTotal = models.reduce((sum, m) => sum + fabricCostTotal(m), 0);
      const totalSpent = constructorTotal + workshopTotal + fabricTotal;
      return `
        <section class="panel">
          <div class="toolbar">
            <div>
              <h2>Статистика</h2>
              <p class="muted">Общая статистика видна только владельцу/дизайнеру и админу.</p>
            </div>
            <div class="filters">
              <button class="${state.statsPeriod === "week" ? "dark" : ""}" data-stats-period="week">Неделя</button>
              <button class="${state.statsPeriod === "month" ? "dark" : ""}" data-stats-period="month">Месяц</button>
              <button class="${state.statsPeriod === "all" ? "dark" : ""}" data-stats-period="all">Все</button>
            </div>
          </div>
          <div class="stat-grid">
            ${stat(money(constructorTotal), "общая оплата конструктору")}
            ${stat(money(workshopTotal), "общая оплата цеху")}
            ${stat(money(fabricTotal), "общая стоимость ткани")}
            ${stat(money(totalSpent), "общая сумма за всё", "total")}
          </div>
          <div class="stat-grid">
            ${stat(inWork.length, "моделей в процессе")}
            ${stat(released.length, "выпущено моделей")}
            ${stat(deleted.length, "удалено из разработки")}
            ${stat(heaviest ? modelLine(heaviest) : "-", "самая тяжелая модель")}
          </div>
        </section>
        <section class="panel">
          <h3>Модели за период</h3>
          <div class="card-grid">${models.map(modelCard).join("") || `<div class="empty">За выбранный период моделей нет</div>`}</div>
        </section>
      `;
    }

    function constructorSettlementsView() {
      if (!canViewConstructorSettlements()) return `<section class="panel"><div class="empty">Нет доступа</div></section>`;
      const constructors = state.users.filter(u => isConstructorRole(u.role) && u.active);
      if (!constructors.length) return `<section class="panel"><div class="empty">Конструкторы пока не созданы</div></section>`;
      if (!state.constructorSettlementUserId || !constructors.find(u => u.id === state.constructorSettlementUserId)) {
        state.constructorSettlementUserId = constructors[0].id;
      }
      const activeConstructor = constructors.find(u => u.id === state.constructorSettlementUserId) || constructors[0];
      const rows = constructorSettlementRows(activeConstructor.id);
      const total = rows.reduce((sum, row) => sum + row.amount, 0);
      const paid = rows.filter(row => row.paid).reduce((sum, row) => sum + row.amount, 0);
      const due = total - paid;
      const released = state.models.filter(m => m.constructorUserId === activeConstructor.id && m.status === "Завершено").length;
      const modelIds = [...new Set(rows.map(row => row.model.id))];
      return `
        <section class="panel">
          <div class="toolbar">
            <div>
              <h2>Расчеты с конструкторами</h2>
              <p class="muted">Детализация начислений по лекалам, бумаге и градации. Доступно только владельцу и админу.</p>
            </div>
          </div>
          <div class="stat-grid">
            ${stat(money(total), "общая оплата конструктору за все время")}
            ${stat(money(paid), "оплачено")}
            ${stat(money(due), "должны", "total")}
            ${stat(released, "выпущено моделей")}
          </div>
          <div class="tabs">${constructors.map(user => `<button class="tab ${user.id === activeConstructor.id ? "active" : ""}" data-constructor-settlement="${user.id}">${escapeHtml(user.name)}</button>`).join("")}</div>
        </section>
        <section class="panel">
          <h3>${escapeHtml(activeConstructor.name)} · ${modelIds.length} моделей</h3>
          ${constructorSettlementModels(activeConstructor.id)}
        </section>
      `;
    }

    function constructorSettlementRows(constructorId) {
      const rows = [];
      state.models.filter(m => m.constructorUserId === constructorId && !isDeleted(m)).forEach(model => {
        (model.payments?.constructor || []).forEach((payment, index) => {
          const amount = Number(payment.amount || 0);
          if (!amount) return;
          rows.push({ model, type: "constructor", index, label: payment.work, amount, paid: !!payment.paid, paidAt: payment.paidAt || "" });
        });
        (model.corrections || []).forEach((correctionItem, correctionIndex) => {
          const amount = Number(correctionItem.paperCost ?? correctionItem.printCost ?? 0);
          if (!amount) return;
          rows.push({ model, type: "paper", index: correctionIndex, label: `Бумага · корректировки ${correctionItem.number}`, amount, paid: !!correctionItem.paperPaid, paidAt: correctionItem.paperPaidAt || "" });
        });
      });
      return rows;
    }

    function constructorSettlementModels(constructorId) {
      const models = state.models.filter(m => m.constructorUserId === constructorId && !isDeleted(m) && constructorSettlementRows(constructorId).some(row => row.model.id === m.id));
      if (!models.length) return `<div class="empty">Начислений по этому конструктору пока нет</div>`;
      return models.map(model => {
        const rows = constructorSettlementRows(constructorId).filter(row => row.model.id === model.id);
        const total = rows.reduce((sum, row) => sum + row.amount, 0);
        const paid = rows.filter(row => row.paid).reduce((sum, row) => sum + row.amount, 0);
        const correctionsCount = (model.corrections || []).length;
        const payState = paid >= total ? "settlement-paid" : paid > 0 ? "settlement-partial" : "settlement-unpaid";
        return `
          <div class="section ${payState}">
            <div class="toolbar">
              <div>
                <h3>${escapeHtml(modelLine(model))}</h3>
                <p class="muted">${escapeHtml(model.status)} · корректировок: ${correctionsCount}</p>
              </div>
              <div class="row">
                <span class="pill">Всего: ${money(total)}</span>
                <span class="pill ok">Оплачено: ${money(paid)}</span>
                <span class="pill ${total - paid > 0 ? "warn" : "ok"}">Должны: ${money(total - paid)}</span>
              </div>
            </div>
            <div class="row">
              ${constructorSettlementSummaryPills(model)}
            </div>
            ${rows.map(row => constructorSettlementPayRow(row)).join("")}
          </div>
        `;
      }).join("");
    }

    function constructorSettlementSummaryPills(model) {
      const pattern = model.payments?.constructor?.[0];
      const patternAmount = Number(pattern?.amount || 0);
      const paperRows = (model.corrections || []).filter(c => Number(c.paperCost ?? c.printCost ?? 0) > 0);
      const paperTotal = paperRows.reduce((sum, c) => sum + Number(c.paperCost ?? c.printCost ?? 0), 0);
      const paperPaid = paperRows.filter(c => c.paperPaid).reduce((sum, c) => sum + Number(c.paperCost ?? c.printCost ?? 0), 0);
      return [
        `<span class="pill ${pattern?.paid ? "ok" : patternAmount ? "warn" : ""}">Лекала: ${money(patternAmount)} · ${pattern?.paid ? "оплачено" : "не оплачено"}</span>`,
        `<span class="pill ${paperTotal && paperPaid >= paperTotal ? "ok" : paperPaid ? "warn" : paperTotal ? "danger" : ""}">Бумага: ${money(paperTotal)} · оплачено ${money(paperPaid)}</span>`,
        `<span class="pill">Корректировки: ${(model.corrections || []).length}</span>`
      ].join("");
    }

    function constructorSettlementPayRow(row) {
      return `
        <div class="table-row">
          <strong>${escapeHtml(row.label)}</strong>
          <span>${money(row.amount)}</span>
          <span>${row.paid ? "Оплачено" : "Не оплачено"}</span>
          <span>${row.paidAt || "-"}</span>
          <span class="table-row-action">${canPay() && !row.paid ? `<button data-settlement-pay="${escapeAttr(row.model.id)}:${row.type}:${row.index}">Оплатить</button>` : ""}</span>
        </div>
      `;
    }

    function modelsForStatsPeriod(includeDeleted = false) {
      const visible = includeDeleted ? state.models : state.models.filter(m => !isDeleted(m));
      if (state.statsPeriod === "all") return visible;
      const days = state.statsPeriod === "week" ? 7 : 30;
      const from = new Date();
      from.setDate(from.getDate() - days);
      return visible.filter(m => new Date(m.createdAt) >= from);
    }

    function heaviestModel(models) {
      const active = models.filter(m => !isDeleted(m));
      if (!active.length) return null;
      return active.reduce((best, model) => {
        const score = (model.samples || []).length + (model.corrections || []).length;
        const bestScore = best ? (best.samples || []).length + (best.corrections || []).length : -1;
        return score > bestScore ? model : best;
      }, null);
    }

    function accessView() {
      if (!isAdmin()) return `<section class="panel"><div class="empty">Нет доступа</div></section>`;
      return `
        <section class="panel">
          <div>
            <h2>Доступы</h2>
            <p class="muted">Создание пользователей, смена ролей и отключение доступов.</p>
          </div>
        </section>
        ${accessTab()}
        ${loginEventsTab()}
        ${systemEventsTab()}
        ${backupTab()}
      `;
    }

    function modelCard(m) {
      const d = deadlineState(m.deadline);
      const unread = unreadCount(m);
      return `
        <button class="model-card ${d.cls ? "deadline-" + d.cls : ""}" data-open="${m.id}">
          ${modelPhotoThumb(m)}
          <strong>${escapeHtml(m.title || "Без названия")}</strong>
          <div class="row">
            <span class="pill">${escapeHtml(m.article || "без артикула")}</span>
            ${unread ? `<span class="pill warn">${unread} новых</span>` : ""}
          </div>
          ${statusBadge(m.status)}
          <span class="muted">Ответственный: ${escapeHtml(userName(m.currentResponsibleUserId))}</span>
          <span class="pill"><span class="dot ${d.cls}"></span>${d.label}: ${m.deadline || "-"}</span>
        </button>
      `;
    }

    function bindHome() {
      bindPhotoOpeners();
      document.querySelectorAll("[data-open]").forEach(btn => btn.onclick = () => {
        state.activeModelId = btn.dataset.open;
        state.view = "detail";
        state.activeTab = "Основная";
        persist();
        syncRoute(false);
        render();
      });
      document.querySelectorAll("[data-filter]").forEach(btn => btn.onclick = () => {
        state.allFilter = btn.dataset.filter;
        persist();
        render();
      });
      const responsibleFilter = document.getElementById("responsibleFilter");
      if (responsibleFilter) responsibleFilter.onchange = () => {
        state.allResponsibleFilter = responsibleFilter.value;
        persist();
        render();
      };
      const modelSearch = document.getElementById("modelSearch");
      if (modelSearch) modelSearch.oninput = () => {
        state.allSearch = modelSearch.value;
        localStorage.setItem(storeKey, JSON.stringify(state));
        clearTimeout(searchRenderTimer);
        searchRenderTimer = setTimeout(() => render(), 180);
      };
      document.querySelectorAll("[data-stats-period]").forEach(btn => btn.onclick = () => {
        state.statsPeriod = btn.dataset.statsPeriod;
        persist();
        render();
      });
      const newBtn = document.getElementById("newModel");
      if (newBtn) newBtn.onclick = createModel;
      document.querySelectorAll("[data-constructor-settlement]").forEach(btn => btn.onclick = () => {
        state.constructorSettlementUserId = btn.dataset.constructorSettlement;
        persist();
        render();
      });
      document.querySelectorAll("[data-settlement-pay]").forEach(btn => btn.onclick = async () => {
        if (!await ensureOnlineWrite("оплата конструктора")) return;
        payConstructorSettlement(btn.dataset.settlementPay);
      });
      bindAccess();
    }

    function renderDetail() {
      const m = currentModel();
      const tabs = allowedTabs();
      if (!tabs.includes(state.activeTab)) state.activeTab = tabs[0];
      if (state.activeTab === "Комментарии") {
        m.unread[currentUser().id] = 0;
        persist();
      }
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="detail-head">
          <div class="toolbar">
            <div>
              <button id="backHome">← На главную</button>
              <h2>${escapeHtml(m.title || "Без названия")}</h2>
              <p class="muted">${escapeHtml(m.article || "без артикула")}</p>
            </div>
            <div class="actions">
              <button id="copyModelLink">Скопировать ссылку</button>
              ${canEditPrimary() ? `<button class="primary" id="saveModelChanges" ${unsavedModelIds.has(m.id) ? "" : "disabled"}>Сохранить изменения</button>` : ""}
              ${canEditPrimary() ? `<span class="save-state ${unsavedModelIds.has(m.id) ? "dirty" : ""}" id="saveState">${unsavedModelIds.has(m.id) ? "Есть несохраненные изменения" : "Все изменения сохранены"}</span>` : ""}
              ${actionButtons(m)}
            </div>
          </div>
          <div class="statusline">
            ${statusBadge(m.status, "status-main")}
            <span class="pill">Ответственный: ${escapeHtml(userName(m.currentResponsibleUserId))}</span>
            <span class="pill">Дедлайн: ${m.deadline || "-"}</span>
            <span class="pill">Создано: ${m.createdAt}</span>
          </div>
          <div class="tabs">${tabs.map(t => `<button class="tab ${state.activeTab === t ? "active" : ""}" data-tab="${t}">${tabTitle(t, m)}</button>`).join("")}</div>
        </div>
        <div class="workspace">${detailTab(m)}</div>
      `;
      bindDetail();
    }

    function detailTab(m) {
      if (state.activeTab === "Основная") return mainTab(m);
      if (state.activeTab === "Комментарии") return commentsTab(m);
      if (state.activeTab === "Оплата конструктора") return constructorPayTab(m);
      if (state.activeTab === "Оплата и расход цеха") return workshopPayTab(m);
      if (state.activeTab === "История") return historyTab(m);
      if (state.activeTab === "Статистика") return statsTab(m);
      return "";
    }

    function tabTitle(tab, model) {
      if (tab !== "Комментарии") return escapeHtml(tab);
      const count = unreadCount(model);
      return `Комментарии${count ? ` <span class="pill warn">${count}</span>` : ""}`;
    }

    function mainTab(m) {
      return `
        <section class="section">
          <div class="toolbar">
            <h3>Исполнители</h3>
            <span class="muted">${canEditPrimary() ? "Выбираются владельцем или админом" : "Только просмотр"}</span>
          </div>
          <div class="grid">
            ${selectUserField("constructorUserId", "Конструктор", "Конструктор", m.constructorUserId)}
            ${selectUserField("workshopUserId", "Цех", "Цех", m.workshopUserId)}
          </div>
        </section>
        <section class="section">
          <div class="toolbar">
            <h3>Первичные данные</h3>
            <span class="muted">${canEditPrimary() ? "Можно редактировать" : "Только просмотр"}</span>
          </div>
          <div class="primary-layout">
            ${modelPhotoSection(m)}
            <div class="primary-fields">
              <div class="primary-row">
                ${selectField("brand", "Бренд", m.brand, ["MOOW", "LEXIE", "Не определились"])}
                ${field("article", "Артикул", m.article)}
                ${field("title", "Название модели", m.title)}
                ${field("sizeRange", "Размерный ряд", m.sizeRange)}
              </div>
              <div class="grid">
                ${field("material", "Материал", m.material)}
                ${field("hardware", "Фурнитура", m.hardware)}
              </div>
              ${area("description", "Описание", m.description)}
              ${area("important", "Детали", m.important)}
              ${area("gradingComment", "Первый комментарий по градации", m.gradingComment)}
            </div>
          </div>
          <div class="subsection">
            <div class="toolbar"><h3>Ссылки на фото/видео</h3>${canEditPrimary() ? `<button id="addLink">+ Добавить ссылку</button>` : ""}</div>
            ${linksList(m.links)}
          </div>
        </section>
        ${m.pattern.sentAt ? patternBlock(m) : ""}
        ${timelineBlocks(m)}
        ${m.grading.sentAt ? gradingBlock(m) : ""}
        ${isAdmin() ? adminBlock(m) : ""}
      `;
    }

    function timelineBlocks(m) {
      const max = Math.max(m.samples.length, m.corrections.length);
      const blocks = [];
      for (let i = 1; i <= max; i += 1) {
        const sampleItem = m.samples.find(s => s.number === i);
        const correctionItem = m.corrections.find(c => c.number === i);
        if (sampleItem) blocks.push(sampleBlock(sampleItem));
        if (correctionItem) blocks.push(correctionBlock(correctionItem));
      }
      return blocks.join("");
    }

    function patternBlock(m) {
      return `
        <section class="section">
          <h3>Разработка лекал</h3>
          ${datesMiniBlock([
            ["Передано конструктору", m.pattern.sentAt],
            ["Взято в работу", m.pattern.acceptedAt],
            ["Дедлайн", m.pattern.deadline],
            ["Фактическая дата сдачи", m.pattern.readyAt]
          ])}
          ${statusMiniBlock(m.status)}
          ${checksMiniBlock([
            ["Проставлены все надсечки", m.pattern.checklist.notches],
            ["Все детали есть в печати", m.pattern.checklist.printDetails],
            [`На лекалах подписан артикул и название (${m.title} ${m.article})`, m.pattern.checklist.signed]
          ])}
        </section>
      `;
    }

    function sampleBlock(s) {
      return `
        <section class="section">
          <h3>Образец ${s.number}</h3>
          ${datesMiniBlock([
            ["Передано в цех", s.sentAt],
            ["Взято в работу", s.acceptedAt],
            ["Дедлайн", s.deadline],
            ["Фактическая дата сдачи", s.readyAt]
          ])}
          ${statusMiniBlock(s.status)}
          ${textMiniBlock(`Комментарий для цеха к образцу ${s.number}`, s.ownerComment, "owner-note")}
          ${s.readyAt ? textMiniBlock(`Комментарий цеха после отшива ${s.number} образца`, s.workshopComment, "workshop-note") : ""}
          ${s.readyAt ? textMiniBlock("Расход ткани", `${s.fabricUsage || 0} м`, "workshop-note") : ""}
          ${s.readyAt ? textMiniBlock("Расход второй ткани/подклада", `${s.liningUsage || 0} м`, "workshop-note") : ""}
          ${s.readyAt ? textMiniBlock("Использованная фурнитура", s.usedHardware, "workshop-note") : ""}
        </section>
      `;
    }

    function actionButtons(m) {
      if (isDeleted(m) || m.status === "Завершено") return "";
      const user = currentUser();
      const isResponsible = m.currentResponsibleUserId === user.id;
      const ownerAction = isOwner() || isAdmin();
      const constructorAction = isConstructorRole(user.role) && isResponsible;
      const workshopAction = isWorkshopRole(user.role) && isResponsible;
      const b = [];
      if (ownerAction && m.status === "Черновик") b.push(`<button data-action="make-new">Сохранить как новая модель</button>`);
      if (ownerAction && ["Черновик", "Новая модель"].includes(m.status)) b.push(`<button class="primary" data-action="send-constructor">Передать конструктору</button>`);
      if (constructorAction && m.status === "Разработка лекал") b.push(`<button class="primary" data-action="take-pattern">Взять в работу</button>`);
      if (constructorAction && m.status === "Лекала в работе") b.push(`<button class="primary" data-action="patterns-ready">Лекала готовы</button>`);
      if (ownerAction && (m.status === "Лекала готовы" || /Корректировки \d+ готовы/.test(m.status))) b.push(`<button class="primary" data-action="send-workshop">Передать цеху</button>`);
      if (workshopAction && /^Отшив образца \d+$/.test(m.status)) b.push(`<button class="primary" data-action="take-sample">Взять в работу</button>`);
      if (workshopAction && /^Образец \d+ в работе$/.test(m.status)) b.push(`<button class="primary" data-action="sample-ready">Образец готов</button>`);
      if (ownerAction && /^Образец \d+ готов$/.test(m.status)) {
        b.push(`<button class="primary" data-action="create-correction">Подать корректировки</button>`);
        b.push(`<button data-action="send-grading">Подать на градацию</button>`);
      }
      if (constructorAction && /^Поданы корректировки \d+$/.test(m.status)) b.push(`<button class="primary" data-action="take-correction">Взять в работу корректировки</button>`);
      if (constructorAction && /^Корректировки \d+ в работе$/.test(m.status)) b.push(`<button class="primary" data-action="correction-ready">Корректировки готовы</button>`);
      if (constructorAction && m.status === "Передано на градацию") b.push(`<button class="primary" data-action="take-grading">Взять в работу градацию</button>`);
      if (constructorAction && m.status === "Градация в работе") b.push(`<button class="primary" data-action="grading-ready">Градация готова</button>`);
      if (ownerAction && m.status === "Градация готова") b.push(`<button class="primary" data-action="finish-model">Модель завершена</button>`);
      return b.join("");
    }

    function bindDetail() {
      document.getElementById("backHome").onclick = () => { state.view = "dashboard"; state.activeModelId = ""; persist(); syncRoute(false); render(); };
      const copyLink = document.getElementById("copyModelLink");
      if (copyLink) copyLink.onclick = () => {
        const url = routeUrl({ model: state.activeModelId, tab: state.activeTab && state.activeTab !== "Основная" ? state.activeTab : "" });
        copyText(url).then(() => {
          copyLink.textContent = "Ссылка скопирована";
          setTimeout(() => { copyLink.textContent = "Скопировать ссылку"; }, 1400);
        }).catch(() => alert("Не удалось скопировать ссылку"));
      };
      document.querySelectorAll("[data-tab]").forEach(btn => btn.onclick = () => { state.activeTab = btn.dataset.tab; persist(); syncRoute(false); render(); });
      document.querySelectorAll("[data-action]").forEach(btn => btn.onclick = async () => {
        if (!ensureCurrentModelSaved()) return;
        if (!await ensureOnlineWrite("смена статуса")) return;
        runAction(btn.dataset.action);
      });
      const saveChanges = document.getElementById("saveModelChanges");
      if (saveChanges) saveChanges.onclick = saveCurrentModelChanges;
      bindPrimary();
      bindPayments();
      bindAccess();
      const addLink = document.getElementById("addLink");
      if (addLink) addLink.onclick = () => {
        const m = currentModel();
        m.links.push("");
        markModelUnsaved(m);
        render();
      };
      document.querySelectorAll("[data-delete-link]").forEach(btn => {
        btn.onclick = () => {
          const m = currentModel();
          const index = Number(btn.dataset.deleteLink);
          const removed = m.links[index] || "";
          m.links.splice(index, 1);
          addHistory(m, `Удалена ссылка ${index + 1}`, { field: "Ссылка", from: removed, to: "-" });
          markModelUnsaved(m);
          render();
        };
      });
      const send = document.getElementById("sendComment");
      if (send) send.onclick = async () => {
        if (!await ensureOnlineWrite("отправка комментария")) return;
        sendComment();
      };
      const adminSave = document.getElementById("adminSave");
      if (adminSave) adminSave.onclick = async () => {
        if (!ensureCurrentModelSaved()) return;
        if (!await ensureOnlineWrite("админское изменение заявки")) return;
        adminSaveModel();
      };
      const del = document.getElementById("deleteModel");
      if (del) del.onclick = async () => {
        if (!ensureCurrentModelSaved()) return;
        if (!await ensureOnlineWrite("удаление из разработки")) return;
        openDeleteModal();
      };
      const photoInput = document.getElementById("modelPhotoInput");
      if (photoInput) photoInput.onchange = handleModelPhotoUpload;
      const removePhoto = document.getElementById("removeModelPhoto");
      if (removePhoto) removePhoto.onclick = () => {
        const m = currentModel();
        m.photoDataUrl = "";
        addHistory(m, "Удалено фото модели");
        markModelUnsaved(m);
        render();
      };
      bindPhotoOpeners();
    }

    function bindPrimary() {
      document.querySelectorAll("[data-field]").forEach(el => {
        const key = el.dataset.field;
        if (key.startsWith("newComment") || key.startsWith("newUser")) return;
        let initialValue = el.value;
        el.disabled = !canEditPrimary();
        const updateValue = () => {
          const m = currentModel();
          if (key.startsWith("link:")) m.links[Number(key.split(":")[1])] = el.value;
          else if (key in m) m[key] = el.value;
          if (key === "constructorUserId") replaceParticipantByRole(m, el.value, "Конструктор");
          if (key === "workshopUserId") replaceParticipantByRole(m, el.value, "Цех");
          markModelUnsaved(m);
        };
        el.oninput = updateValue;
        el.onchange = () => {
          const changed = el.value !== initialValue;
          updateValue();
          if (changed) {
            addHistory(currentModel(), `Изменено поле "${labelFor(key)}"`, { field: labelFor(key), from: initialValue, to: el.value });
            initialValue = el.value;
            markModelUnsaved(currentModel());
          }
        };
      });
    }

    function bindPayments() {
      document.querySelectorAll("[data-pay]").forEach(btn => btn.onclick = async () => {
        if (!ensureCurrentModelSaved()) return;
        if (!await ensureOnlineWrite("оплата")) return;
        if (!canPay()) return;
        const [type, index] = btn.dataset.pay.split(":");
        const m = currentModel();
        const item = type === "constructor" ? m.payments.constructor[Number(index)] : type === "paper" ? m.corrections.filter(c => Number(c.paperCost ?? c.printCost ?? 0) > 0)[Number(index)] : m.samples.filter(s => s.readyAt)[Number(index)];
        if (!item || (type === "paper" ? item.paperPaid : item.paid)) return;
        if (type === "paper") {
          if (item.paperPaid) return;
          item.paperPaid = true;
          item.paperPaidAt = today();
        } else {
          item.paid = true;
          item.paidAt = today();
        }
        addHistory(m, `Оплачено: ${type === "constructor" ? item.work : type === "paper" ? "За бумагу по корректировкам " + item.number : "Образец " + item.number}`);
        await saveAndRender();
      });
    }

    function payConstructorSettlement(payload) {
      const [modelId, type, rawIndex] = String(payload || "").split(":");
      const model = state.models.find(m => m.id === modelId);
      if (!model) return alert("Модель не найдена");
      const index = Number(rawIndex);
      let item = null;
      let label = "";
      if (type === "constructor") {
        item = model.payments?.constructor?.[index];
        if (!item || item.paid) return;
        item.paid = true;
        item.paidAt = today();
        label = item.work;
      }
      if (type === "paper") {
        item = model.corrections?.[index];
        if (!item || item.paperPaid) return;
        item.paperPaid = true;
        item.paperPaidAt = today();
        label = `За бумагу по корректировкам ${item.number}`;
      }
      if (!item) return;
      addHistory(model, `Оплачено: ${label}`);
      saveAndRender();
    }

    function markModelUnsaved(model) {
      if (!model) return;
      unsavedModelIds.add(model.id);
      setSaveStatus("saving", "Есть несохраненные изменения");
      localStorage.setItem(storeKey, JSON.stringify(state));
      updateSaveState(model.id);
    }

    function updateSaveState(modelId) {
      const dirty = unsavedModelIds.has(modelId);
      const btn = document.getElementById("saveModelChanges");
      const stateLabel = document.getElementById("saveState");
      if (btn) btn.disabled = !dirty;
      if (stateLabel) {
        stateLabel.classList.toggle("dirty", dirty);
        stateLabel.textContent = dirty ? "Есть несохраненные изменения" : "Все изменения сохранены";
      }
    }

    async function saveCurrentModelChanges() {
      const m = currentModel();
      if (!m) return;
      if (!unsavedModelIds.has(m.id)) return;
      const btn = document.getElementById("saveModelChanges");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Сохраняю...";
      }
      try {
        localStorage.setItem(storeKey, JSON.stringify(state));
        if (hasSupabase()) {
          if (!await ensureOnlineWrite("сохранение заявки")) throw new Error("Remote database is not ready");
          await saveRemoteNow();
        } else {
          localStorage.setItem(storeKey, JSON.stringify(state));
        }
        unsavedModelIds.delete(m.id);
        updateSaveState(m.id);
        render();
      } catch (error) {
        console.warn("Model save failed", error);
        setSaveStatus("error", "Не сохранено");
        addSystemEvent("error", "Не удалось сохранить заявку", error.message || "Supabase не принял запись");
        unsavedModelIds.add(m.id);
        updateSaveState(m.id);
        forceLogoutForDatabase("Изменения не сохранены: связь с онлайн-базой потеряна. CRM завершила сессию, чтобы не было иллюзии работы.");
      }
    }

    function ensureCurrentModelSaved() {
      const m = currentModel();
      if (!m || !unsavedModelIds.has(m.id)) return true;
      alert("Сначала нажмите “Сохранить изменения” в заявке.");
      return false;
    }

    function bindAccess() {
      if (isAdmin() && hasSupabase() && !cloudBackupsRequested) {
        cloudBackupsRequested = true;
        loadCloudBackups().then(render).catch(error => console.warn(error));
      }
      document.querySelectorAll("[data-user-field]").forEach(el => {
        el.onchange = el.oninput = () => {
          const user = accessDraft.find(u => u.id === el.dataset.user);
          if (!user) return;
          user[el.dataset.userField] = ["active", "telegramEnabled"].includes(el.dataset.userField) ? el.value === "true" : el.value;
        };
      });
      const create = document.getElementById("createUser");
      if (create) create.onclick = () => {
        const name = document.querySelector("[data-field='newUserName']").value.trim();
        const login = cleanLogin(document.querySelector("[data-field='newUserLogin']").value);
        const email = cleanEmail(document.querySelector("[data-field='newUserEmail']").value) || defaultEmailForLogin(login);
        const password = document.querySelector("[data-field='newUserPassword']").value.trim();
        const role = document.getElementById("newUserRole").value;
        const telegramChatId = document.querySelector("[data-field='newUserTelegram']").value.trim();
        const telegramEnabled = document.getElementById("newUserTelegramEnabled").value === "true";
        if (!name || !login || !password) return;
        accessDraft.push({ id: uid(), name, login, email, password, role, active: true, telegramChatId, telegramEnabled });
        render();
      };
      document.querySelectorAll("[data-delete-user]").forEach(btn => btn.onclick = () => {
        accessDraft = accessDraft.filter(u => u.id !== btn.dataset.deleteUser);
        render();
      });
      const saveAccess = document.getElementById("saveAccessChanges");
      if (saveAccess) saveAccess.onclick = async () => {
        if (!await ensureOnlineWrite("сохранение доступов")) return;
        const before = structuredClone(state.users);
        state.users = normalizeUsers(accessDraft);
        accessDraft = structuredClone(state.users);
        addAccessHistory(before, state.users);
        await saveAndRender();
      };
      const cancelAccess = document.getElementById("cancelAccessChanges");
      if (cancelAccess) cancelAccess.onclick = () => {
        accessDraft = structuredClone(state.users);
        render();
      };
      document.querySelectorAll("[data-test-telegram]").forEach(btn => btn.onclick = () => {
        const user = accessDraft.find(u => u.id === btn.dataset.testTelegram);
        if (!user) return;
        sendTelegramToUser(user, "Тестовое уведомление CRM: Telegram подключен.").then(ok => {
          alert(ok ? "Тестовое уведомление отправлено" : "Не удалось отправить. Проверьте chat ID, TELEGRAM_BOT_TOKEN и что пользователь написал боту /start.");
        });
      });
      document.querySelectorAll("[data-find-telegram]").forEach(btn => btn.onclick = () => {
        const user = accessDraft.find(u => u.id === btn.dataset.findTelegram);
        if (!user) return;
        findTelegramChatId(user).then(result => {
          if (!result?.chatId) return alert(telegramLookupError(result, user));
          user.telegramChatId = result.chatId;
          user.telegramEnabled = true;
          render();
          alert(`Chat ID найден: ${result.chatId}. Нажмите “Сохранить доступы”.`);
        });
      });
      const checkBot = document.getElementById("checkTelegramBot");
      if (checkBot) checkBot.onclick = () => {
        checkTelegramBotStatus().then(result => {
          if (result?.ok) return alert(`Бот подключен: @${result.bot?.username || "без username"}`);
          alert(`Бот не отвечает: ${result?.error || "неизвестная ошибка"}`);
        });
      };
      const clearEvents = document.getElementById("clearSystemEvents");
      if (clearEvents) clearEvents.onclick = () => {
        if (!confirm("Очистить системный журнал?")) return;
        state.systemEvents = [];
        persist();
        render();
      };
      bindBackupControls();
    }

    function normalizeUsers(usersList) {
      return usersList.map(user => {
        const login = cleanLogin(user.login);
        const email = cleanEmail(user.email || defaultEmailForLogin(login));
        return {
          ...user,
          name: String(user.name || "").trim(),
          login,
          email,
          password: String(user.password || "").trim(),
          role: normalizeRole(user.role),
          active: !!user.active,
          telegramChatId: String(user.telegramChatId || "").trim(),
          telegramEnabled: !!user.telegramEnabled
        };
      });
    }

    function cleanLogin(value) {
      return String(value || "").trim().toLowerCase();
    }

    function cleanEmail(value) {
      return String(value || "").trim().toLowerCase();
    }

    function normalizeRole(role) {
      const raw = String(role || "").trim();
      const lower = raw.toLowerCase();
      if (!raw) return "Владелец бренда/Дизайнер";
      if (lower.includes("админ") || lower === "admin") return "Админ";
      if (lower.includes("владел") || lower.includes("дизайн") || lower === "owner") return "Владелец бренда/Дизайнер";
      if (lower.includes("конструкт") || lower.includes("конструтор") || lower === "constructor") return "Конструктор";
      if (lower.includes("цех") || lower.includes("шве") || lower.includes("workshop")) return "Цех";
      return roles.includes(raw) ? raw : "Владелец бренда/Дизайнер";
    }

    function addAccessHistory(before, after) {
      const adminModel = state.models[0];
      if (!adminModel) return;
      const beforeById = Object.fromEntries(before.map(user => [user.id, user]));
      after.forEach(user => {
        const old = beforeById[user.id];
        if (!old) return addHistory(adminModel, `Создан доступ: ${user.name}`, { from: "-", to: user.role });
        ["name", "login", "email", "role", "active", "telegramChatId", "telegramEnabled"].forEach(field => {
          if (String(old[field]) !== String(user[field])) addHistory(adminModel, `Изменен доступ: ${user.name}`, { field: labelForUserField(field), from: String(old[field] ?? "-"), to: String(user[field] ?? "-") });
        });
      });
      before.forEach(user => {
        if (!after.find(item => item.id === user.id)) addHistory(adminModel, `Удален доступ: ${user.name}`, { from: user.role, to: "-" });
      });
    }

    function labelForUserField(field) {
      return ({ name: "Имя", login: "Логин", email: "Email", role: "Роль", active: "Доступ", telegramChatId: "Telegram chat ID", telegramEnabled: "Telegram уведомления" })[field] || field;
    }

    async function sendTelegramToUser(userId, message) {
      const user = typeof userId === "object" ? userId : state.users.find(u => u.id === userId);
      if (!user?.telegramEnabled || !user.telegramChatId) return false;
      try {
        const response = await fetch("/api/telegram", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ chatId: user.telegramChatId, text: message })
        });
        if (!response.ok) {
          addSystemEvent("warn", `Telegram не отправлен: ${user.name}`, await response.text());
          return false;
        }
        return true;
      } catch (error) {
        addSystemEvent("warn", `Telegram не отправлен: ${user.name}`, error.message || "Ошибка сети");
        console.warn("Telegram notification failed", error);
        return false;
      }
    }

    function notifyUser(userId, message) {
      sendTelegramToUser(userId, message).catch(error => console.warn("Telegram notification failed", error));
    }

    function notifyUsers(userIds, message) {
      [...new Set(userIds.filter(Boolean))].forEach(userId => notifyUser(userId, message));
    }

    function adminUserIds() {
      return state.users.filter(user => isAdminRole(user.role) && user.active).map(user => user.id);
    }

    function runTelegramAutomations() {
      if (!currentUser()) return;
      sendDeadlineReminders();
      sendAdminDailyDigest();
      localStorage.setItem(storeKey, JSON.stringify(state));
      if (remoteReady && remoteLoaded && !unsavedModelIds.size) queueRemoteSave();
    }

    function sendDeadlineReminders() {
      state.telegramReminderLog = state.telegramReminderLog || [];
      state.models.filter(m => inProcess(m) && m.deadline).forEach(model => {
        const days = daysUntil(model.deadline);
        const kind = days < 0 ? "overdue" : days === 1 ? "tomorrow" : "";
        if (!kind) return;
        const key = `${today()}:${kind}:${model.id}:${model.deadline}`;
        if (state.telegramReminderLog.includes(key)) return;
        const title = kind === "overdue"
          ? `Просрочен дедлайн по заявке (${Math.abs(days)} дн.)`
          : "До дедлайна остался 1 день";
        notifyUsers([model.currentResponsibleUserId, ...adminUserIds()], taskNotification(model, title));
        state.telegramReminderLog.push(key);
      });
      state.telegramReminderLog = state.telegramReminderLog.slice(-500);
    }

    function sendAdminDailyDigest() {
      if (!isAdmin()) return;
      state.telegramDigestLog = state.telegramDigestLog || [];
      const key = `${today()}:admin-digest`;
      if (state.telegramDigestLog.includes(key)) return;
      const active = state.models.filter(inProcess);
      const overdue = active.filter(m => m.deadline && daysUntil(m.deadline) < 0);
      const dueToday = active.filter(m => m.deadline && daysUntil(m.deadline) === 0);
      const dueTomorrow = active.filter(m => m.deadline && daysUntil(m.deadline) === 1);
      const lines = [
        "Ежедневная сводка CRM",
        telegramField("В работе", active.length),
        telegramField("Просрочено", overdue.length),
        telegramField("Сдать сегодня", dueToday.length),
        telegramField("Дедлайн завтра", dueTomorrow.length),
        "",
        ...digestModelLines("Просрочено", overdue),
        ...digestModelLines("Сегодня", dueToday),
        ...digestModelLines("Завтра", dueTomorrow)
      ];
      notifyUsers(adminUserIds(), lines.filter(line => line !== null).join("\n"));
      state.telegramDigestLog.push(key);
      state.telegramDigestLog = state.telegramDigestLog.slice(-120);
    }

    function digestModelLines(title, models) {
      if (!models.length) return [];
      return [`<b>${telegramEscape(title)}:</b>`, ...models.slice(0, 8).map(m => `- ${telegramEscape(modelLine(m))} · ${telegramEscape(m.status)} · ${telegramEscape(userName(m.currentResponsibleUserId))}`)];
    }

    function daysUntil(dateValue) {
      const start = new Date(today() + "T00:00:00");
      const end = new Date(dateValue + "T00:00:00");
      return Math.round((end - start) / 86400000);
    }

    function notifyMovement(model, title, userIds = []) {
      notifyUsers([...userIds, ...adminUserIds()], taskNotification(model, title));
    }

    function notifyAssigneeTask(model, assigneeUserId, assigneeTitle, adminTitle, extra = []) {
      notifyUsers([assigneeUserId], taskNotification(model, assigneeTitle, extra));
      notifyUsers(adminUserIds(), taskNotification(model, adminTitle, extra));
    }

    async function findTelegramChatId(user) {
      try {
        const response = await fetch("/api/telegram", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "findChatId", login: user.login, email: user.email })
        });
        const payload = await response.json().catch(() => ({}));
        return response.ok ? payload : { ok: false, ...payload };
      } catch (error) {
        console.warn("Telegram chat id lookup failed", error);
        return { ok: false, error: "CRM не смогла обратиться к /api/telegram" };
      }
    }

    async function checkTelegramBotStatus() {
      try {
        const response = await fetch("/api/telegram", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "checkBot" })
        });
        const payload = await response.json().catch(() => ({}));
        return response.ok ? payload : { ok: false, ...payload };
      } catch (error) {
        return { ok: false, error: "CRM не смогла обратиться к /api/telegram" };
      }
    }

    function telegramLookupError(result, user) {
      const command = `/start ${user.login || user.email || user.id}`;
      if (!result) return `Chat ID не найден. Попросите пользователя написать боту: ${command}`;
      if (result.error?.includes("TELEGRAM_BOT_TOKEN")) return "В Vercel не настроена переменная TELEGRAM_BOT_TOKEN или после настройки не был сделан redeploy.";
      const recent = (result.recentMessages || []).filter(item => item.text).map(item => `- ${item.text}`).join("\n");
      return [
        `Chat ID не найден.`,
        `Пользователь должен открыть именно вашего бота и отправить: ${command}`,
        `После этого нажмите “Найти ID” еще раз.`,
        result.updatesChecked !== undefined ? `Проверено сообщений у бота: ${result.updatesChecked}` : "",
        recent ? `Последние сообщения, которые видит бот:\n${recent}` : ""
      ].filter(Boolean).join("\n\n");
    }

    function modelLine(model) {
      return `${model.title || "Без названия"}${model.article ? ` · ${model.article}` : ""}`;
    }

    function modelUrl(model) {
      return `${location.origin}${location.pathname}#model=${encodeURIComponent(model.id)}`;
    }

    function telegramEscape(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    }

    function telegramField(label, value) {
      const displayValue = value === undefined || value === null || value === "" ? "-" : value;
      return `<b>${telegramEscape(label)}:</b> ${telegramEscape(displayValue)}`;
    }

    function telegramExtraLine(line) {
      const text = String(line || "").trim();
      if (!text) return null;
      const index = text.indexOf(":");
      if (index < 1) return telegramEscape(text);
      return telegramField(text.slice(0, index), text.slice(index + 1).trim());
    }

    function isTelegramSeparatedLine(line) {
      return /^(Комментарий|Текст корректировок|Ссылка|Открыть заявку)/i.test(String(line || "").trim());
    }

    function pushTelegramLine(lines, line, separated = false) {
      if (!line) return;
      if (separated && lines.length && lines[lines.length - 1] !== "") lines.push("");
      lines.push(line);
      if (separated) lines.push("");
    }

    function taskNotification(model, title, extra = []) {
      const lines = [telegramEscape(title), ""];
      pushTelegramLine(lines, telegramField("Модель", modelLine(model)), true);
      pushTelegramLine(lines, telegramField("Статус", model.status), true);
      if (model.deadline) pushTelegramLine(lines, telegramField("Дедлайн", model.deadline), true);
      extra.filter(Boolean).forEach(item => pushTelegramLine(lines, telegramExtraLine(item), isTelegramSeparatedLine(item)));
      pushTelegramLine(lines, telegramField("Открыть заявку", modelUrl(model)), true);
      return lines.filter((line, index, list) => line !== "" || (list[index - 1] !== "" && index !== list.length - 1)).join("\n");
    }

    function taskContext(model, type) {
      if (type === "pattern") {
        return [
          model.sizeRange ? `Размерный ряд: ${model.sizeRange}` : "",
          model.material ? `Материал: ${model.material}` : "",
          model.hardware ? `Фурнитура: ${model.hardware}` : "",
          model.gradingComment ? `Комментарий по градации: ${model.gradingComment}` : ""
        ];
      }
      return [];
    }

    function bindBackupControls() {
      const exportBtn = document.getElementById("exportBackup");
      if (exportBtn) exportBtn.onclick = exportBackup;
      const importInput = document.getElementById("importBackup");
      if (importInput) importInput.onchange = importBackup;
      const restoreBtn = document.getElementById("restorePreRemote");
      if (restoreBtn) restoreBtn.onclick = restorePreRemoteBackup;
      const forceBtn = document.getElementById("forceCloudSave");
      if (forceBtn) forceBtn.onclick = () => {
        if (!confirm("Записать текущие модели и доступы из этого браузера в Supabase?")) return;
        remoteReady = true;
        remoteLoaded = true;
        saveRemoteNow().then(() => alert("Текущие данные записаны в Supabase")).catch(error => {
          console.warn(error);
          addSystemEvent("error", "Ручная запись в Supabase не прошла", error.message || "Supabase не принял запись");
          alert("Supabase не принял запись");
        });
      };
      const refreshCloud = document.getElementById("refreshCloudBackups");
      if (refreshCloud) refreshCloud.onclick = () => {
        loadCloudBackups().then(render).catch(error => {
          console.warn(error);
          addSystemEvent("warn", "Не удалось загрузить облачные копии", error.message || "");
          alert("Не удалось загрузить облачные копии");
        });
      };
      const makeCloud = document.getElementById("makeCloudBackup");
      if (makeCloud) makeCloud.onclick = () => {
        createCloudBackup("Ручная копия администратора", { force: true, data: sharedState() }).then(() => {
          return loadCloudBackups();
        }).then(() => {
          alert("Облачная копия создана");
          render();
        }).catch(error => {
          console.warn(error);
          addSystemEvent("warn", "Не удалось создать облачную копию", error.message || "");
          alert("Не удалось создать облачную копию. Проверьте SQL для crm_backups в Supabase.");
        });
      };
      document.querySelectorAll("[data-restore-cloud]").forEach(btn => btn.onclick = () => restoreCloudBackup(btn.dataset.restoreCloud));
      document.querySelectorAll("[data-preview-cloud]").forEach(btn => btn.onclick = () => previewCloudBackup(btn.dataset.previewCloud));
    }

    function previewCloudBackup(id) {
      const backup = (state.cloudBackups || []).find(item => item.id === id);
      if (!backup?.data) return alert("Копия не найдена");
      const models = backup.data.models || [];
      const usersCount = (backup.data.users || []).length;
      const lastModels = models.slice(0, 8).map(m => `- ${modelLine(m)} · ${m.status}`).join("\n");
      alert([
        `Копия от ${formatDateTime(backup.created_at)}`,
        backup.reason || "Автокопия",
        "",
        `Моделей: ${models.length}`,
        `Доступов: ${usersCount}`,
        "",
        lastModels || "Моделей нет"
      ].join("\n"));
    }

    function restoreCloudBackup(id) {
      const backup = (state.cloudBackups || []).find(item => item.id === id);
      if (!backup?.data) return alert("Копия не найдена");
      if (!confirm(`Восстановить облачную копию от ${formatDateTime(backup.created_at)} и заменить текущие модели/доступы?`)) return;
      if (!applySharedData(backup.data)) return alert("Не удалось прочитать облачную копию");
      remoteReady = true;
      remoteLoaded = true;
      saveRemoteNow().then(() => loadCloudBackups()).then(() => {
        addSystemEvent("info", "Облачная копия восстановлена", formatDateTime(backup.created_at));
        alert("Облачная копия восстановлена");
        render();
      }).catch(error => {
        console.warn(error);
        addSystemEvent("error", "Копия восстановлена локально, но не записалась в Supabase", error.message || "");
        alert("Копия восстановлена в этом браузере, но Supabase не принял запись");
        render();
      });
    }

    function restorePreRemoteBackup() {
      const backup = readBackup(preRemoteBackupKey);
      if (!backup?.data) return;
      if (!confirm("Восстановить локальную копию и заменить текущие модели/доступы?")) return;
      if (!applySharedData(backup.data)) return alert("Не удалось прочитать резервную копию");
      remoteReady = true;
      remoteLoaded = true;
      saveRemoteNow().then(() => {
        addSystemEvent("info", "Локальная копия восстановлена", backupSummary(backup));
        alert("Локальная копия восстановлена и записана в Supabase");
        render();
      }).catch(error => {
        console.warn(error);
        addSystemEvent("error", "Локальная копия восстановлена, но не записалась в Supabase", error.message || "");
        alert("Копия восстановлена в этом браузере, но Supabase не принял запись");
        render();
      });
    }

    function exportBackup() {
      const payload = {
        type: "fashion-crm-backup",
        createdAt: new Date().toISOString(),
        data: sharedState()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `fashion-crm-backup-${today()}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || "{}"));
          const data = parsed.data?.users && parsed.data?.models ? parsed.data : parsed;
          if (!data.users || !data.models) throw new Error("Bad backup");
          if (!confirm("Импортировать копию и заменить текущие модели/доступы?")) return;
          applySharedData(data);
          remoteReady = true;
          remoteLoaded = true;
          saveRemoteNow().then(() => {
            addSystemEvent("info", "JSON-копия импортирована", `${(data.models || []).length} моделей`);
            alert("Копия импортирована и записана в Supabase");
            render();
          }).catch(error => {
            console.warn(error);
            addSystemEvent("error", "JSON-копия импортирована, но не записалась в Supabase", error.message || "");
            alert("Копия импортирована в этот браузер, но Supabase не принял запись");
            render();
          });
        } catch (error) {
          alert("Не удалось прочитать файл резервной копии");
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    }

        </div>

      if (f.type === "checkbox") return `<label class="check span-2"><input id="modal-${f.id}" type="checkbox"><span>${f.label}</span></label>`;
      return `<label><span>${f.label}${f.required ? " *" : ""}</span><input id="modal-${f.id}" type="${f.type || "text"}" value="${value}"></label>`;
    }

    function setPhotoUploadHint(text, isError = false) {
      const hint = document.getElementById("photoUploadHint");
      if (!hint) return;

    function loadImageFromSource(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function imageToCompressedDataUrl(img) {
      const attempts = [
        { maxSide: 900, quality: 0.74 },
        { maxSide: 700, quality: 0.68 },
        { maxSide: 520, quality: 0.62 },
        { maxSide: 420, quality: 0.58 }
      ];
      let lastDataUrl = "";
      for (const attempt of attempts) {
        const scale = Math.min(1, attempt.maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) throw new Error("Планшет не смог подготовить фото");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        lastDataUrl = canvas.toDataURL("image/jpeg", attempt.quality);
        if (lastDataUrl.length < 1300000) return lastDataUrl;
      }
      return lastDataUrl;
    }

    async function preparePhotoDataUrl(file) {
      const dataUrl = await readFileAsDataUrl(file);
      const originalCanBeSaved = /^image\/(jpeg|jpg|png|webp)$/i.test(file.type || "") && dataUrl.length < 1300000;
      if (originalCanBeSaved) return dataUrl;
      try {
        const img = await loadImageFromSource(dataUrl);
        return imageToCompressedDataUrl(img);
      } catch (error) {
        const objectUrl = URL.createObjectURL(file);
        try {
          const img = await loadImageFromSource(objectUrl);
          return imageToCompressedDataUrl(img);
        } finally {
          URL.revokeObjectURL(objectUrl);
        }
      }
    }

    async function handleModelPhotoUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const isImage = file.type.startsWith("image/") || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name || "") || !file.type;
      if (!isImage) return alert("Выберите файл изображения");
      setPhotoUploadHint("Фото загружается и сжимается...");
      try {
        const compressed = await preparePhotoDataUrl(file);
        if (!compressed || compressed.length > 2600000) {
          throw new Error("Слишком большое фото");
        }
        const m = currentModel();
        m.photoDataUrl = compressed;
        addHistory(m, "Обновлено фото модели");
        markModelUnsaved(m);
        render();
      } catch (error) {
        console.warn("Photo upload failed", error);
        const message = "Не удалось загрузить это фото. На планшете откройте фото, сделайте скриншот и загрузите скриншот.";
        setPhotoUploadHint(message, true);
        alert(message);
      } finally {
        event.target.value = "";
      }
    }

    }

    function defaultEmailForLogin(login) {
      return `${cleanLogin(login)}@fashion-crm.local`;
    }

    document.getElementById("loginButton").onclick = async () => {
      const login = cleanLogin(document.getElementById("loginInput").value);
      const password = document.getElementById("passwordInput").value.trim();
      loginNotice = "";
      document.getElementById("loginError").textContent = "";
      if (hasSupabase() && !remoteReady) {
        return document.getElementById("loginError").textContent = `CRM не подключена к онлайн-базе${remoteError ? ` (${remoteError})` : ""}. Вход временно закрыт.`;
      }
      const userByLogin = state.users.find(u => cleanLogin(u.login) === login || cleanEmail(u.email) === login);
      if (!userByLogin) return document.getElementById("loginError").textContent = "Такой логин или email не найден";
      if (!userByLogin.active) return document.getElementById("loginError").textContent = "Этот доступ отключен";
      if (String(userByLogin.password || "").trim() !== password) return document.getElementById("loginError").textContent = "Пароль не совпадает";
      const user = userByLogin;
      loginAs(user.id);
    };
    document.getElementById("passwordInput").onkeydown = e => { if (e.key === "Enter") document.getElementById("loginButton").click(); };
    document.getElementById("logoutButton").onclick = () => { state.currentUserId = ""; state.activeModelId = ""; persist(); render(); };
    window.addEventListener("hashchange", () => {
      if (!currentUser()) return;
      applyInitialModelLink(true);
      render();
    });

    function modelPhotoThumb(m) {
      if (m.photoDataUrl) return `
        <span class="photo-frame">
          <img class="model-photo" src="${escapeAttr(m.photoDataUrl)}" alt="Фото модели">
          <span class="photo-open-control" data-photo-open="${escapeAttr(m.id)}" title="Открыть фото">+</span>
        </span>
      `;
      return `<div class="model-photo-placeholder">Без фото</div>`;
    }
    function modelPhotoSection(m) {
      const preview = m.photoDataUrl
        ? `
          <span class="photo-frame">
            <img class="photo-preview" src="${escapeAttr(m.photoDataUrl)}" alt="Фото модели">
            <button class="photo-open-control" data-photo-open="${escapeAttr(m.id)}" title="Открыть фото" type="button">+</button>
          </span>
        `
        : `<div class="model-photo-placeholder">Фото не загружено</div>`;
      return `
        <div class="primary-photo-block">
          ${preview}
          ${canEditPrimary() ? `
            <div class="actions">
              <label class="file-button">
                <span>${m.photoDataUrl ? "Заменить фото" : "Загрузить фото"}</span>
                <input id="modelPhotoInput" type="file" accept="image/*,.heic,.heif">
              </label>
              ${m.photoDataUrl ? `<button id="removeModelPhoto" class="danger">Удалить фото</button>` : ""}
            </div>
            <div id="photoUploadHint" class="photo-upload-hint"></div>
          ` : ""}
        </div>
      `;
    }
    function field(key, label, value, type = "text") { return `<label><span>${label}</span><input data-field="${key}" type="${type}" value="${escapeAttr(value || "")}"></label>`; }
    function area(key, label, value, cls = "") { return `<label class="${cls}"><span>${label}</span><textarea data-field="${key}">${escapeHtml(value || "")}</textarea></label>`; }
    function selectField(key, label, value, options) {
      return `<label><span>${label}</span><select data-field="${key}">${options.map(option => `<option ${option === value ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}</select></label>`;
    }
    function selectUserField(key, label, role, value) {
      const opts = state.users.filter(u => normalizeRole(u.role) === role && u.active).map(u => `<option value="${u.id}" ${u.id === value ? "selected" : ""}>${u.name}</option>`).join("");
      return `<label><span>${label}</span><select data-field="${key}" ${canEditPrimary() ? "" : "disabled"}>${opts}</select></label>`;
    }
    function readonly(label, value) { return `<div><span class="muted">${label}</span><p>${escapeHtml(value || "-")}</p></div>`; }
    function statusReadonly(label, status) { return `<div><span class="muted">${label}</span><p>${statusBadge(status)}</p></div>`; }
    function areaReadonly(label, value) { return `<div class="span-4"><span class="muted">${label}</span><p>${escapeHtml(value || "-")}</p></div>`; }
    function checkView(label, checked) { return `<span class="pill ${checked ? "ok" : ""}">${checked ? "✓" : "○"} ${escapeHtml(label)}</span>`; }
    function statusMiniBlock(status) {
      return `<div class="mini-block"><span class="mini-title">Статус</span>${statusBadge(status, "status-main")}</div>`;
    }
    function datesMiniBlock(items) {
      return `<div class="mini-block"><span class="mini-title">Даты</span><div class="date-row">${items.map(([label, value]) => dateItem(label, value)).join("")}</div></div>`;
    }
    function dateItem(label, value) {
      return `<div class="date-item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || "-")}</strong></div>`;
    }
    function textMiniBlock(label, value, tone = "") {
      return `<div class="text-block ${tone}"><span>${escapeHtml(label)}</span><p>${escapeHtml(value || "-")}</p></div>`;
    }
    function linkMiniBlock(label, value, tone = "") {
      const href = linkHref(value);
      const content = href ? `<a href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(value)}</a>` : "-";
      return `<div class="text-block ${tone}"><span>${escapeHtml(label)}</span><p>${content}</p></div>`;
    }
    function linksList(links = []) {
      const rows = links.map((link, i) => {
        const href = linkHref(link);
        return `
          <div class="link-row">
            ${field(`link:${i}`, `Ссылка ${i + 1}`, link)}
            ${href ? `<a href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">Открыть</a>` : `<span></span>`}
            ${canEditPrimary() ? `<button class="danger" data-delete-link="${i}">Удалить</button>` : `<span></span>`}
          </div>
        `;
      }).join("");
      return `<div class="link-list">${rows || `<div class="empty-links">Ссылок пока нет</div>`}</div>`;
    }
    function linkHref(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      if (/^(https?:\/\/|tg:\/\/|mailto:)/i.test(raw)) return raw;
      return `https://${raw}`;
    }
    function checksMiniBlock(items) {
      return `<div class="mini-block"><span class="mini-title">Проверочный чек-лист</span><div class="check-row">${items.map(([label, checked]) => checkView(label, checked)).join("")}</div></div>`;
    }
    function payRow(p, type, index) {
      return `<div class="table-row"><strong>${escapeHtml(p.work)}</strong><span>${money(p.amount)}</span><span>${p.paid ? "Оплачено" : "Не оплачено"}</span><span>${p.paidAt || "-"}</span><span class="table-row-action">${canPay() && !p.paid ? `<button data-pay="${type}:${index}">Оплачено</button>` : ""}</span></div>`;
    }
    function paperPayRow(c, index) {
      const amount = Number(c.paperCost ?? c.printCost ?? 0);
      return `<div class="table-row"><strong>За бумагу · корректировки ${c.number}</strong><span>${money(amount)}</span><span>${c.paperPaid ? "Оплачено" : "Не оплачено"}</span><span>${c.paperPaidAt || "-"}</span><span class="table-row-action">${canPay() && !c.paperPaid ? `<button data-pay="paper:${index}">Оплачено</button>` : ""}</span></div>`;
    }
    function samplePayRow(s, index) {
      const fabricCost = fabricCostForSample(currentModel(), s);
      const showFabricCost = canPay();
      return `<div class="table-row workshop-pay-row ${showFabricCost ? "" : "limited"}"><strong>Образец ${s.number}</strong><span>${money(s.cost)}</span><span>${s.fabricUsage || 0} м</span><span>${s.liningUsage || 0} м</span>${showFabricCost ? `<span>${money(fabricCost)}</span>` : ""}<span>${escapeHtml(s.usedHardware || "-")}</span><span>${s.paid ? "Оплачено " + s.paidAt : "Не оплачено"}</span><span class="table-row-action">${canPay() && !s.paid ? `<button data-pay="workshop:${index}">Оплачено</button>` : ""}</span></div>`;
    }
    function stat(value, label, cls = "") { return `<div class="stat ${cls}"><strong>${escapeHtml(String(value))}</strong><span class="muted">${label}</span></div>`; }
    function labelFor(key) { return ({ brand: "Бренд", title: "Название", article: "Артикул", sizeRange: "Размерный ряд", material: "Материал", hardware: "Фурнитура", fabricMeterPrice: "Стоимость 1 метра ткани", liningMeterPrice: "Стоимость второй ткани/подклада", description: "Описание", important: "Важные детали", gradingComment: "Комментарий по градации", constructorUserId: "Конструктор", workshopUserId: "Цех" })[key] || key; }
    function escapeHtml(v) { return String(v).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch])); }
    function escapeAttr(v) { return escapeHtml(v).replace(/`/g, "&#096;"); }

    render();
    initRemoteState();
  </script>
</body>
</html>
