    function backupSummary(backup) {
      return backup
        ? `${formatDateTime(backup.createdAt)} · моделей: ${(backup.data?.models || []).length}`
        : "Копии пока нет";
    }

    function actionButtons(m) {
      if (isDeleted(m) || m.status === "Завершено") return "";
      const user = currentUser();
      const isResponsible = m.currentResponsibleUserId === user.id;
      const ownerAction = isOwner() || isAdmin();
      const constructorAction = user.role === "Конструктор" && isResponsible;
      const workshopAction = user.role === "Цех" && isResponsible;
      const b = [];
      if (ownerAction && m.status === "Черновик") b.push(`<button data-action="make-new">Сохранить как новая модель</button>`);
      if (ownerAction && ["Черновик", "Новая модель"].includes(m.status)) b.push(`<button class="primary" data-action="send-constructor">Передать конструктору</button>`);
      if (constructorAction && m.status === "Разработка лекал") b.push(`<button class="primary" data-action="take-pattern">Взять в работу</button>`);
      if (constructorAction && m.status === "Лекала в работе") b.push(`<button class="primary" data-action="patterns-ready">Лекала готовы</button>`);
      if (ownerAction && (m.status === "Лекала готовы" || /Корректировки \d+ готовы/.test(m.status))) b.push(`<button class="primary" data-action="send-workshop">Передать цеху</button>`);
      if (workshopAction && /^Отшив образца \d+$/.test(m.status)) b.push(`<button class="primary" data-action="take-sample">Взять в работу</button>`);
      if (workshopAction && /^Образец \d+ в работе$/.test(m.status)) b.push(`<button class="primary" data-action="sample-ready">Образец готов</button>`);
      if (ownerAction && /^Образец \d+ готов$/.test(m.status)) {
        b.push(`<button class="primary" data-action="create-correction">Подать корректировки</button>`);
        b.push(`<button data-action="send-grading">Подать на градацию</button>`);
      }
      if (constructorAction && /^Поданы корректировки \d+$/.test(m.status)) b.push(`<button class="primary" data-action="take-correction">Взять в работу корректировки</button>`);
      if (constructorAction && /^Корректировки \d+ в работе$/.test(m.status)) b.push(`<button class="primary" data-action="correction-ready">Корректировки готовы</button>`);
      if (constructorAction && m.status === "Передано на градацию") b.push(`<button class="primary" data-action="take-grading">Взять в работу градацию</button>`);
      if (constructorAction && m.status === "Градация в работе") b.push(`<button class="primary" data-action="grading-ready">Градация готова</button>`);
      if (ownerAction && m.status === "Градация готова") b.push(`<button class="primary" data-action="finish-model">Модель завершена</button>`);
      return b.join("");
    }

    function bindDetail() {
      document.getElementById("backHome").onclick = () => { state.view = "dashboard"; state.activeModelId = ""; persist(); render(); };
      document.querySelectorAll("[data-tab]").forEach(btn => btn.onclick = () => { state.activeTab = btn.dataset.tab; persist(); render(); });
      document.querySelectorAll("[data-action]").forEach(btn => btn.onclick = () => runAction(btn.dataset.action));
      bindPrimary();
      bindPayments();
      bindAccess();
      const addLink = document.getElementById("addLink");
      if (addLink) addLink.onclick = () => { currentModel().links.push(""); persist(); render(); };
      const send = document.getElementById("sendComment");
      if (send) send.onclick = sendComment;
      const adminSave = document.getElementById("adminSave");
      if (adminSave) adminSave.onclick = adminSaveModel;
      const del = document.getElementById("deleteModel");
      if (del) del.onclick = openDeleteModal;
      const photoInput = document.getElementById("modelPhotoInput");
      if (photoInput) photoInput.onchange = handleModelPhotoUpload;
      const removePhoto = document.getElementById("removeModelPhoto");
      if (removePhoto) removePhoto.onclick = () => {
        const m = currentModel();
        m.photoDataUrl = "";
        addHistory(m, "Удалено фото модели");
        persist();
        render();
      };
      bindPhotoOpeners();
    }

    function bindPrimary() {
      document.querySelectorAll("[data-field]").forEach(el => {
        const key = el.dataset.field;
        if (key.startsWith("newComment") || key.startsWith("newUser")) return;
        let initialValue = el.value;
        el.disabled = !canEditPrimary();
        const updateValue = () => {
          const m = currentModel();
          if (key.startsWith("link:")) m.links[Number(key.split(":")[1])] = el.value;
          else if (key in m) m[key] = el.value;
          if (key === "constructorUserId") replaceParticipantByRole(m, el.value, "Конструктор");
          if (key === "workshopUserId") replaceParticipantByRole(m, el.value, "Цех");
          persist();
        };
        el.oninput = updateValue;
        el.onchange = () => {
          const changed = el.value !== initialValue;
          updateValue();
          if (changed) {
            addHistory(currentModel(), `Изменено поле "${labelFor(key)}"`, { field: labelFor(key), from: initialValue, to: el.value });
            initialValue = el.value;
            persist();
          }
        };
      });
    }

    function bindPayments() {
      document.querySelectorAll("[data-pay]").forEach(btn => btn.onclick = () => {
        if (!canPay()) return;
        const [type, index] = btn.dataset.pay.split(":");
        const m = currentModel();
        const item = type === "constructor" ? m.payments.constructor[Number(index)] : m.samples.filter(s => s.readyAt)[Number(index)];
        if (item.paid) return;
        item.paid = true;
        item.paidAt = today();
        addHistory(m, `Оплачено: ${type === "constructor" ? item.work : "Образец " + item.number}`);
        persist();
        render();
      });
    }

    function bindAccess() {
      if (isAdmin() && hasSupabase() && !cloudBackupsRequested) {
        cloudBackupsRequested = true;
        loadCloudBackups().then(render).catch(error => console.warn(error));
      }
      document.querySelectorAll("[data-user-field]").forEach(el => {
        el.onchange = el.oninput = () => {
          const user = accessDraft.find(u => u.id === el.dataset.user);
          if (!user) return;
          user[el.dataset.userField] = ["active", "telegramEnabled"].includes(el.dataset.userField) ? el.value === "true" : el.value;
        };
      });
      const create = document.getElementById("createUser");
      if (create) create.onclick = () => {
        const name = document.querySelector("[data-field='newUserName']").value.trim();
        const login = document.querySelector("[data-field='newUserLogin']").value.trim();
        const email = document.querySelector("[data-field='newUserEmail']").value.trim() || defaultEmailForLogin(login);
        const password = document.querySelector("[data-field='newUserPassword']").value.trim();
        const role = document.getElementById("newUserRole").value;
        const telegramChatId = document.querySelector("[data-field='newUserTelegram']").value.trim();
        const telegramEnabled = document.getElementById("newUserTelegramEnabled").value === "true";
        if (!name || !login || !password) return;
        accessDraft.push({ id: uid(), name, login, email, password, role, active: true, telegramChatId, telegramEnabled });
        render();
      };
      document.querySelectorAll("[data-delete-user]").forEach(btn => btn.onclick = () => {
        accessDraft = accessDraft.filter(u => u.id !== btn.dataset.deleteUser);
        render();
      });
      const saveAccess = document.getElementById("saveAccessChanges");
      if (saveAccess) saveAccess.onclick = () => {
        const before = structuredClone(state.users);
        state.users = normalizeUsers(accessDraft);
        accessDraft = structuredClone(state.users);
        addAccessHistory(before, state.users);
        persist();
        render();
      };
      const cancelAccess = document.getElementById("cancelAccessChanges");
      if (cancelAccess) cancelAccess.onclick = () => {
        accessDraft = structuredClone(state.users);
        render();
      };
      document.querySelectorAll("[data-test-telegram]").forEach(btn => btn.onclick = () => {
        const user = accessDraft.find(u => u.id === btn.dataset.testTelegram);
        if (!user) return;
        sendTelegramToUser(user, "Тестовое уведомление CRM: Telegram подключен.").then(ok => {
          alert(ok ? "Тестовое уведомление отправлено" : "Не удалось отправить. Проверьте chat ID, TELEGRAM_BOT_TOKEN и что пользователь написал боту /start.");
        });
      });
      document.querySelectorAll("[data-find-telegram]").forEach(btn => btn.onclick = () => {
        const user = accessDraft.find(u => u.id === btn.dataset.findTelegram);
        if (!user) return;
        findTelegramChatId(user).then(result => {
          if (!result?.chatId) return alert(telegramLookupError(result, user));
          user.telegramChatId = result.chatId;
          user.telegramEnabled = true;
          render();
          alert(`Chat ID найден: ${result.chatId}. Нажмите “Сохранить доступы”.`);
        });
      });
      const checkBot = document.getElementById("checkTelegramBot");
      if (checkBot) checkBot.onclick = () => {
        checkTelegramBotStatus().then(result => {
          if (result?.ok) return alert(`Бот подключен: @${result.bot?.username || "без username"}`);
          alert(`Бот не отвечает: ${result?.error || "неизвестная ошибка"}`);
        });
      };
      bindBackupControls();
    }

    function normalizeUsers(usersList) {
      return usersList.map(user => ({ ...user, email: user.email || defaultEmailForLogin(user.login), active: !!user.active, telegramChatId: user.telegramChatId || "", telegramEnabled: !!user.telegramEnabled }));
    }

    function addAccessHistory(before, after) {
      const adminModel = state.models[0];
      if (!adminModel) return;
      const beforeById = Object.fromEntries(before.map(user => [user.id, user]));
      after.forEach(user => {
        const old = beforeById[user.id];
        if (!old) return addHistory(adminModel, `Создан доступ: ${user.name}`, { from: "-", to: user.role });
        ["name", "login", "email", "role", "active", "telegramChatId", "telegramEnabled"].forEach(field => {
          if (String(old[field]) !== String(user[field])) addHistory(adminModel, `Изменен доступ: ${user.name}`, { field: labelForUserField(field), from: String(old[field] ?? "-"), to: String(user[field] ?? "-") });
        });
      });
      before.forEach(user => {
        if (!after.find(item => item.id === user.id)) addHistory(adminModel, `Удален доступ: ${user.name}`, { from: user.role, to: "-" });
      });
    }

    function labelForUserField(field) {
      return ({ name: "Имя", login: "Логин", email: "Email", role: "Роль", active: "Доступ", telegramChatId: "Telegram chat ID", telegramEnabled: "Telegram уведомления" })[field] || field;
    }

    async function sendTelegramToUser(userId, message) {
      const user = typeof userId === "object" ? userId : state.users.find(u => u.id === userId);
      if (!user?.telegramEnabled || !user.telegramChatId) return false;
      try {
        const response = await fetch("/api/telegram", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ chatId: user.telegramChatId, text: message })
        });
        return response.ok;
      } catch (error) {
        console.warn("Telegram notification failed", error);
        return false;
      }
    }

    function notifyUser(userId, message) {
      sendTelegramToUser(userId, message).catch(error => console.warn("Telegram notification failed", error));
    }

    function notifyUsers(userIds, message) {
      [...new Set(userIds.filter(Boolean))].forEach(userId => notifyUser(userId, message));
    }

    function adminUserIds() {
      return state.users.filter(user => user.role === "Админ" && user.active).map(user => user.id);
    }

    function notifyMovement(model, title, userIds = []) {
      notifyUsers([...userIds, ...adminUserIds()], taskNotification(model, title));
    }

    async function findTelegramChatId(user) {
      try {
        const response = await fetch("/api/telegram", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "findChatId", login: user.login, email: user.email })
        });
        const payload = await response.json().catch(() => ({}));
        return response.ok ? payload : { ok: false, ...payload };
      } catch (error) {
        console.warn("Telegram chat id lookup failed", error);
        return { ok: false, error: "CRM не смогла обратиться к /api/telegram" };
      }
    }

    async function checkTelegramBotStatus() {
      try {
        const response = await fetch("/api/telegram", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "checkBot" })
        });
        const payload = await response.json().catch(() => ({}));
        return response.ok ? payload : { ok: false, ...payload };
      } catch (error) {
        return { ok: false, error: "CRM не смогла обратиться к /api/telegram" };
      }
    }

    function telegramLookupError(result, user) {
      const command = `/start ${user.login || user.email || user.id}`;
      if (!result) return `Chat ID не найден. Попросите пользователя написать боту: ${command}`;
      if (result.error?.includes("TELEGRAM_BOT_TOKEN")) return "В Vercel не настроена переменная TELEGRAM_BOT_TOKEN или после настройки не был сделан redeploy.";
      const recent = (result.recentMessages || []).filter(item => item.text).map(item => `- ${item.text}`).join("\n");
      return [
        `Chat ID не найден.`,
        `Пользователь должен открыть именно вашего бота и отправить: ${command}`,
        `После этого нажмите “Найти ID” еще раз.`,
        result.updatesChecked !== undefined ? `Проверено сообщений у бота: ${result.updatesChecked}` : "",
        recent ? `Последние сообщения, которые видит бот:\n${recent}` : ""
      ].filter(Boolean).join("\n\n");
    }

    function modelLine(model) {
      return `${model.title || "Без названия"}${model.article ? ` · ${model.article}` : ""}`;
    }

    function taskNotification(model, title) {
      return `${title}\nМодель: ${modelLine(model)}\nСтатус: ${model.status}\nДедлайн: ${model.deadline || "не задан"}`;
    }

    function bindBackupControls() {
      const exportBtn = document.getElementById("exportBackup");
      if (exportBtn) exportBtn.onclick = exportBackup;
      const importInput = document.getElementById("importBackup");
      if (importInput) importInput.onchange = importBackup;
      const restoreBtn = document.getElementById("restorePreRemote");
      if (restoreBtn) restoreBtn.onclick = restorePreRemoteBackup;
      const forceBtn = document.getElementById("forceCloudSave");
      if (forceBtn) forceBtn.onclick = () => {
        if (!confirm("Записать текущие модели и доступы из этого браузера в Supabase?")) return;
        remoteReady = true;
        remoteLoaded = true;
        saveRemoteNow().then(() => alert("Текущие данные записаны в Supabase")).catch(error => {
          console.warn(error);
          alert("Supabase не принял запись");
        });
      };
      const refreshCloud = document.getElementById("refreshCloudBackups");
      if (refreshCloud) refreshCloud.onclick = () => {
        loadCloudBackups().then(render).catch(error => {
          console.warn(error);
          alert("Не удалось загрузить облачные копии");
        });
      };
      const makeCloud = document.getElementById("makeCloudBackup");
      if (makeCloud) makeCloud.onclick = () => {
        createCloudBackup("Ручная копия администратора", { force: true, data: sharedState() }).then(() => {
          return loadCloudBackups();
        }).then(() => {
          alert("Облачная копия создана");
          render();
        }).catch(error => {
          console.warn(error);
          alert("Не удалось создать облачную копию. Проверьте SQL для crm_backups в Supabase.");
        });
      };
      document.querySelectorAll("[data-restore-cloud]").forEach(btn => btn.onclick = () => restoreCloudBackup(btn.dataset.restoreCloud));
    }

    function restoreCloudBackup(id) {
      const backup = (state.cloudBackups || []).find(item => item.id === id);
      if (!backup?.data) return alert("Копия не найдена");
      if (!confirm(`Восстановить облачную копию от ${formatDateTime(backup.created_at)} и заменить текущие модели/доступы?`)) return;
      if (!applySharedData(backup.data)) return alert("Не удалось прочитать облачную копию");
      remoteReady = true;
      remoteLoaded = true;
      saveRemoteNow().then(() => loadCloudBackups()).then(() => {
        alert("Облачная копия восстановлена");
        render();
      }).catch(error => {
        console.warn(error);
        alert("Копия восстановлена в этом браузере, но Supabase не принял запись");
        render();
      });
    }

    function restorePreRemoteBackup() {
      const backup = readBackup(preRemoteBackupKey);
      if (!backup?.data) return;
      if (!confirm("Восстановить локальную копию и заменить текущие модели/доступы?")) return;
      if (!applySharedData(backup.data)) return alert("Не удалось прочитать резервную копию");
      remoteReady = true;
      remoteLoaded = true;
      saveRemoteNow().then(() => {
        alert("Локальная копия восстановлена и записана в Supabase");
        render();
      }).catch(error => {
        console.warn(error);
        alert("Копия восстановлена в этом браузере, но Supabase не принял запись");
        render();
      });
    }

    function exportBackup() {
      const payload = {
        type: "fashion-crm-backup",
        createdAt: new Date().toISOString(),
        data: sharedState()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `fashion-crm-backup-${today()}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || "{}"));
          const data = parsed.data?.users && parsed.data?.models ? parsed.data : parsed;
          if (!data.users || !data.models) throw new Error("Bad backup");
          if (!confirm("Импортировать копию и заменить текущие модели/доступы?")) return;
          applySharedData(data);
          remoteReady = true;
          remoteLoaded = true;
          saveRemoteNow().then(() => {
            alert("Копия импортирована и записана в Supabase");
            render();
          }).catch(error => {
            console.warn(error);
            alert("Копия импортирована в этот браузер, но Supabase не принял запись");
            render();
          });
        } catch (error) {
          alert("Не удалось прочитать файл резервной копии");
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    }

    function saveAndRender() { persist(); render(); }
    function getCurrentNumber(m) { return Number((m.status.match(/\d+/) || [m.samples.length || m.corrections.length || 1])[0]); }
    function currentSample(m) { const n = getCurrentNumber(m); return m.samples.find(s => s.number === n) || m.samples[m.samples.length - 1]; }
    function currentCorrection(m) { const n = getCurrentNumber(m); return m.corrections.find(c => c.number === n) || m.corrections[m.corrections.length - 1]; }
    function askDeadline(title, cb) { formModal(title, [{ id: "deadline", label: "Плановая дата готовности", type: "date", required: true }], data => cb(data.deadline)); }
    function checklistFields() {
      return [
        { id: "notches", label: "Проставлены все надсечки" },
        { id: "printDetails", label: "Все детали есть в печати" },
        { id: "signed", label: "На лекалах подписан артикул и название модели" }
      ];
    }
    function pickChecklist(data) { return { notches: !!data.notches, printDetails: !!data.printDetails, signed: !!data.signed }; }

    function formModal(title, fields, onSubmit) {
      const root = document.getElementById("modalRoot");
      root.classList.remove("hidden");
      root.innerHTML = `
        <div class="modal">
          <h3>${escapeHtml(title)}</h3>
          <div class="grid">${fields.map(modalField).join("")}</div>
          <div class="actions"><button id="modalCancel">Отмена</button><button class="primary" id="modalSubmit">Сохранить</button></div>
        </div>
      `;
      document.getElementById("modalCancel").onclick = closeModal;
      document.getElementById("modalSubmit").onclick = () => {
        const data = {};
        for (const f of fields) {
          const el = document.getElementById("modal-" + f.id);
          data[f.id] = f.type === "checkbox" ? el.checked : el.value.trim();
          if (f.required && !data[f.id]) return alert("Заполните обязательные поля");
        }
        closeModal();
        onSubmit(data);
      };
    }

    function checklistModal(title, checks, extraFields, onSubmit) {
      formModal(title, [...checks.map(c => ({ ...c, type: "checkbox", required: true })), ...extraFields], onSubmit);
    }

    function modalField(f) {
      const value = escapeAttr(f.value || "");
      if (f.type === "textarea") return `<label class="span-2"><span>${f.label}${f.required ? " *" : ""}</span><textarea id="modal-${f.id}">${escapeHtml(f.value || "")}</textarea></label>`;
      if (f.type === "checkbox") return `<label class="check span-2"><input id="modal-${f.id}" type="checkbox"><span>${f.label}</span></label>`;
      return `<label><span>${f.label}${f.required ? " *" : ""}</span><input id="modal-${f.id}" type="${f.type || "text"}" value="${value}"></label>`;
    }

    function closeModal() {
      const root = document.getElementById("modalRoot");
      root.classList.add("hidden");
      root.innerHTML = "";
      root.onclick = null;
    }

    function handleModelPhotoUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) return alert("Выберите файл изображения");
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        const maxSide = 1200;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const m = currentModel();
        m.photoDataUrl = canvas.toDataURL("image/jpeg", 0.86);
        addHistory(m, "Обновлено фото модели");
        URL.revokeObjectURL(objectUrl);
        persist();
        render();
      };
      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        alert("Не удалось загрузить изображение");
      };
      img.src = objectUrl;
    }

    function loginAs(id) {
      const user = state.users.find(u => u.id === id && u.active);
      if (!user) return;
      state.currentUserId = user.id;
      state.view = "dashboard";
      recordLogin(user);
      persist();
      render();

    function recordLogin(user) {
      state.loginEvents = state.loginEvents || [];
      state.loginEvents.unshift({
        id: uid(),
        userId: user.id,
        userName: user.name,
        role: user.role,
        login: user.email || user.login,
        at: new Date().toISOString(),
        userAgent: navigator.userAgent
      });
      state.loginEvents = state.loginEvents.slice(0, 200);
    }

    function defaultEmailForLogin(login) {
      return `${String(login || "").trim().toLowerCase()}@fashion-crm.local`;

    document.getElementById("loginButton").onclick = async () => {
      const login = document.getElementById("loginInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      document.getElementById("loginError").textContent = "";

    function field(key, label, value, type = "text") { return `<label><span>${label}</span><input data-field="${key}" type="${type}" value="${escapeAttr(value || "")}"></label>`; }
    function area(key, label, value, cls = "") { return `<label class="${cls}"><span>${label}</span><textarea data-field="${key}">${escapeHtml(value || "")}</textarea></label>`; }
    function selectField(key, label, value, options) {
      return `<label><span>${label}</span><select data-field="${key}">${options.map(option => `<option ${option === value ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}</select></label>`;
    }
    function selectUserField(key, label, role, value) {
      const opts = state.users.filter(u => u.role === role && u.active).map(u => `<option value="${u.id}" ${u.id === value ? "selected" : ""}>${u.name}</option>`).join("");
      return `<label><span>${label}</span><select data-field="${key}" ${canEditPrimary() ? "" : "disabled"}>${opts}</select></label>`;
    }
    function readonly(label, value) { return `<div><span class="muted">${label}</span><p>${escapeHtml(value || "-")}</p></div>`; }
    function statusReadonly(label, status) { return `<div><span class="muted">${label}</span><p>${statusBadge(status)}</p></div>`; }
    function areaReadonly(label, value) { return `<div class="span-4"><span class="muted">${label}</span><p>${escapeHtml(value || "-")}</p></div>`; }
    function checkView(label, checked) { return `<span class="pill ${checked ? "ok" : ""}">${checked ? "✓" : "○"} ${escapeHtml(label)}</span>`; }
    function statusMiniBlock(status) {
      return `<div class="mini-block"><span class="mini-title">Статус</span>${statusBadge(status, "status-main")}</div>`;
    }
    function datesMiniBlock(items) {
      return `<div class="mini-block"><span class="mini-title">Даты</span><div class="date-row">${items.map(([label, value]) => dateItem(label, value)).join("")}</div></div>`;
    }
    function dateItem(label, value) {
      return `<div class="date-item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || "-")}</strong></div>`;
    }
    function textMiniBlock(label, value, tone = "") {
      return `<div class="text-block ${tone}"><span>${escapeHtml(label)}</span><p>${escapeHtml(value || "-")}</p></div>`;
    }
    function checksMiniBlock(items) {
      return `<div class="mini-block"><span class="mini-title">Проверочный чек-лист</span><div class="check-row">${items.map(([label, checked]) => checkView(label, checked)).join("")}</div></div>`;
    }
    function payRow(p, type, index) {
      return `<div class="table-row"><strong>${escapeHtml(p.work)}</strong><span>${money(p.amount)}</span><span>${p.paid ? "Оплачено" : "Не оплачено"}</span><span>${p.paidAt || "-"}</span>${canPay() && !p.paid ? `<button data-pay="${type}:${index}">Оплачено</button>` : `<span></span>`}</div>`;
    }
    function samplePayRow(s, index) {
      return `<div class="table-row workshop-pay-row"><strong>Образец ${s.number}</strong><span>${money(s.cost)}</span><span>${s.fabricUsage || 0} м</span><span>${escapeHtml(s.usedHardware || "-")}</span><span>${s.paid ? "Оплачено " + s.paidAt : "Не оплачено"}</span>${canPay() && !s.paid ? `<button data-pay="workshop:${index}">Оплачено</button>` : `<span></span>`}</div>`;
    }
    function stat(value, label, cls = "") { return `<div class="stat ${cls}"><strong>${escapeHtml(String(value))}</strong><span class="muted">${label}</span></div>`; }
    function labelFor(key) { return ({ brand: "Бренд", title: "Название", article: "Артикул", sizeRange: "Размерный ряд", material: "Материал", hardware: "Фурнитура", description: "Описание", important: "Важные детали", gradingComment: "Комментарий по градации", constructorUserId: "Конструктор", workshopUserId: "Цех" })[key] || key; }
    function escapeHtml(v) { return String(v).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch])); }
    function escapeAttr(v) { return escapeHtml(v).replace(/`/g, "&#096;"); }

    render();
    initRemoteState();
  </script>
</body>
</html>
