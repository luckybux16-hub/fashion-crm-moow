<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM моделей одежды</title>
  <style>
    :root {
      --bg: #f4f3ef;
      --panel: #fff;
      --soft: #faf9f6;
      --text: #202522;
      --muted: #6f7671;
      --line: #ddd8cf;
      --accent: #177366;
      --ink: #1f2d2a;
      --warn: #b87512;
      --danger: #b74742;
      --ok: #2d8550;
      --shadow: 0 18px 45px rgba(32, 37, 34, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    button, input, textarea, select { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 7px;
      min-height: 38px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:hover { border-color: #b7b0a6; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
    button.danger { color: var(--danger); border-color: rgba(183, 71, 66, .45); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .filters button { min-width: 104px; justify-content: center; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 10px 11px;
      min-height: 40px;
      color: var(--text);
    }
    input[type="checkbox"] { width: 18px; min-height: 18px; }
    textarea { resize: vertical; min-height: 78px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 650; }
    label.check { grid-template-columns: 20px 1fr; align-items: center; color: var(--text); }

    .hidden { display: none !important; }
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-card { width: min(920px, 100%); display: grid; grid-template-columns: 1fr 1.15fr; gap: 18px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }
    .panel.flat { box-shadow: none; }
    .login-panel { align-content: start; }
    .login-brand {
      position: relative;
      overflow: hidden;
      min-height: 360px;
      align-content: space-between;
      background:
        linear-gradient(135deg, rgba(23,115,102,.08), rgba(255,255,255,0) 38%),
        linear-gradient(315deg, rgba(103,65,159,.08), rgba(255,255,255,0) 42%),
        #fff;
    }
    .brand-stack { display: grid; gap: 10px; max-width: 420px; }
    .brand-kicker { color: var(--accent); font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
    .atelier-board {
      display: grid;
      grid-template-columns: 1.2fr .8fr 1fr;
      gap: 10px;
      align-items: end;
      min-height: 150px;
    }
    .material-swatch {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(32,37,34,.08);
      min-height: 90px;
      display: grid;
      align-content: end;
      padding: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }
    .material-swatch.tall { min-height: 138px; background: #f5fbf8; border-color: rgba(23,115,102,.24); }
    .material-swatch.mid { min-height: 112px; background: #f7f2fb; border-color: rgba(103,65,159,.22); }
    .material-swatch.short { min-height: 82px; background: #fff9ec; border-color: rgba(184,117,18,.24); }
    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 30px; }
    h2 { font-size: 25px; }
    h3 { font-size: 16px; }
    p { margin: 0; line-height: 1.45; }
    .muted { color: var(--muted); font-size: 13px; }
    .quick-logins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .quick-login { text-align: left; min-height: 76px; display: grid; gap: 4px; align-content: center; }

    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .session-bar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .main-nav, .row, .toolbar, .statusline, .tabs, .actions, .filters { display: flex; align-items: center; gap: 8px; }
    .main-nav { flex-wrap: wrap; }
    .nav-btn.active, .tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .workspace { width: min(1280px, 100%); margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
    .toolbar { justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .primary-row { display: grid; grid-template-columns: 1fr 118px 2fr 1fr; gap: 12px; align-items: end; }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }

    .stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-height: 82px; }
    .stat strong { display: block; font-size: 26px; line-height: 1.1; margin-bottom: 6px; }
    .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .model-card {
      text-align: left;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 150px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .model-card:hover { box-shadow: var(--shadow); border-color: #b9b2a7; }
    .model-card.deadline-warn { background: #fff9eb; border-color: rgba(184, 117, 18, .38); }
    .model-card.deadline-danger { background: #fff0ee; border-color: rgba(183, 71, 66, .35); }
    .model-card strong { font-size: 16px; overflow-wrap: anywhere; }
    .model-photo {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--soft);
      cursor: zoom-in;
    }
    .model-photo-placeholder {
      width: 100%;
      aspect-ratio: 2 / 3;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px dashed var(--line);
      background: var(--soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      min-height: 26px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      max-width: 100%;
    }
    .pill.danger { color: var(--danger); border-color: rgba(183,71,66,.35); }
    .pill.ok { color: var(--ok); border-color: rgba(45,133,80,.35); }
    .pill.warn { color: var(--warn); border-color: rgba(184,117,18,.35); }
    .status-badge {
      color: #17201d;
      border-width: 1px;
      border-style: solid;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.45);
    }
    .status-draft { background: #f1ece3; border-color: #cfc6b8; }
    .status-pattern { background: #dcefeb; border-color: #9dcac1; }
    .status-sample { background: #e7edf8; border-color: #aabde0; }
    .status-correction { background: #f4e7f1; border-color: #d5aecb; }
    .status-grading { background: #eee8fb; border-color: #bcaedf; }
    .status-ready { background: #e2f1e7; border-color: #9fcaad; }
    .status-finished { background: #dfece4; border-color: #8fb89d; }
    .status-deleted { background: #f7e2df; border-color: #d89993; color: #7e2722; }
    .status-main {
      min-height: 34px;
      padding: 7px 12px;
      font-size: 13px;
    }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--muted); flex: 0 0 auto; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.danger { background: var(--danger); }

    .detail-head {
      display: grid;
      gap: 12px;
      background: rgba(244, 243, 239, .95);
      border-bottom: 1px solid var(--line);
      padding: 16px 20px;
      position: sticky;
      top: 58px;
      z-index: 4;
      backdrop-filter: blur(12px);
    }
    .section { display: grid; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: var(--shadow); }
    .subsection { display: grid; gap: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .primary-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: stretch; }
    .primary-fields { display: grid; gap: 12px; }
    .primary-photo-block { display: grid; gap: 10px; align-content: start; }
    .photo-preview {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--soft);
      cursor: zoom-in;
    }
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }
    .file-button input { display: none; }
    .mini-block { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); padding: 12px; }
    .mini-title { color: var(--muted); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
    .date-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .date-item { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 8px 10px; min-height: 58px; }
    .date-item span { display: block; color: var(--muted); font-size: 12px; font-weight: 750; margin-bottom: 4px; }
    .date-item strong { display: block; font-size: 14px; line-height: 1.15; overflow-wrap: anywhere; }
    .text-block { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 12px; display: grid; gap: 6px; }
    .text-block.owner-note { background: #f6fbf9; border-color: rgba(23, 115, 102, .28); }
    .text-block.workshop-note { background: #f7f5ff; border-color: rgba(117, 94, 166, .28); }
    .text-block.correction-note { background: #fff7fb; border-color: rgba(180, 88, 145, .28); }
    .text-block.link-note { background: #fff7fb; border-color: rgba(180, 88, 145, .28); }
    .text-block span { color: var(--muted); font-size: 13px; font-weight: 750; }
    .text-block p { font-size: 15px; overflow-wrap: anywhere; }
    .check-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .pay-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 1.2fr; gap: 12px; }
    .pay-summary .stat.total { background: #f3edff; border-color: #cdbbeb; }
    .pay-summary .stat.total strong { color: #67419f; }
    .chat { display: grid; gap: 10px; max-width: 850px; }
    .comment { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 12px; display: grid; gap: 8px; }
    .comment-head { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .table-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .table-row.workshop-pay-row { grid-template-columns: 1.1fr .8fr .8fr 1.2fr 1fr auto; }
    .history-row { display: grid; grid-template-columns: 150px 1fr 160px; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .history-row small { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin-top: 4px; overflow-wrap: anywhere; }
    .access-row { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr 1fr 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(23, 31, 28, .45); display: grid; place-items: center; padding: 20px; }
    .modal { width: min(620px, 100%); background: #fff; border-radius: 8px; border: 1px solid var(--line); box-shadow: 0 26px 80px rgba(0,0,0,.22); padding: 18px; display: grid; gap: 14px; }
    .photo-modal {
      position: relative;
      width: min(94vw, 980px);
      height: min(94vh, 980px);
      display: grid;
      place-items: center;
    }
    .photo-modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 26px 80px rgba(0,0,0,.32);
      background: #fff;
    }
    .photo-modal button {
      position: absolute;
      top: 10px;
      right: 10px;
      min-width: 42px;
      min-height: 42px;
      border-color: rgba(255,255,255,.45);
      background: rgba(255,255,255,.92);
    }
    .empty { padding: 28px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; background: rgba(255,255,255,.55); }
    .sync-warning { border-color: rgba(183,71,66,.35); background: #fff0ee; color: #7e2722; }
    .welcome-panel {
      overflow: hidden;
      position: relative;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr);
      align-items: stretch;
    }
    .welcome-copy { display: grid; gap: 10px; align-content: center; }
    .welcome-copy h2 { font-size: 28px; }
    .focus-strip { display: flex; flex-wrap: wrap; gap: 8px; }
    .focus-card {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 8px;
      align-content: start;
    }
    .focus-card strong { font-size: 15px; }
    .mood-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      min-height: 150px;
    }
    .mood-tile {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      min-height: 82px;
      display: grid;
      place-items: end start;
      padding: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .mood-tile:nth-child(1) { background: #f6fbf9; border-color: rgba(23,115,102,.23); }
    .mood-tile:nth-child(2) { background: #fff9ec; border-color: rgba(184,117,18,.24); }
    .mood-tile:nth-child(3) { background: #f7f2fb; border-color: rgba(103,65,159,.22); }
    .mood-tile:nth-child(4) { background: #f5f2ec; }
    .mood-tile:nth-child(5) { background: #eef4fa; border-color: rgba(70,100,145,.2); }
    .mood-tile:nth-child(6) { background: #fbf4f3; border-color: rgba(183,71,66,.2); }

    @media (max-width: 980px) {
      .login-card, .grid, .grid.three, .grid.four, .stat-grid, .card-grid, .table-row, .table-row.workshop-pay-row, .history-row, .access-row, .pay-summary { grid-template-columns: 1fr; }
      .welcome-panel { grid-template-columns: 1fr; }
      .primary-layout { grid-template-columns: 1fr; }
      .photo-preview { max-width: 280px; }
      .primary-row { grid-template-columns: 1fr; }
      .date-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .span-2, .span-3, .span-4 { grid-column: auto; }
      .session-bar, .toolbar { align-items: stretch; flex-direction: column; }
      .detail-head { top: 0; }
    }

    @media (max-width: 720px) {
      h1 { font-size: 25px; }
      h2 { font-size: 21px; }
      h3 { font-size: 15px; }
      button, .file-button { width: 100%; min-height: 42px; }
      .login-screen { padding: 12px; place-items: start center; }
      .login-card, .quick-logins { grid-template-columns: 1fr; }
      .login-brand { min-height: 300px; }
      .atelier-board { min-height: 120px; }
      .material-swatch.tall { min-height: 112px; }
      .material-swatch.mid { min-height: 96px; }
      .material-swatch.short { min-height: 72px; }
      .welcome-copy h2 { font-size: 23px; }
      .mood-board { grid-template-columns: repeat(2, 1fr); min-height: auto; }
      .panel, .section { padding: 14px; gap: 12px; }
      .workspace { padding: 12px; gap: 12px; }
      .session-bar {
        position: static;
        padding: 10px 12px;
        align-items: stretch;
        flex-direction: column;
      }
      .session-bar .row,
      .main-nav,
      .statusline,
      .tabs,
      .actions,
      .filters {
        align-items: stretch;
        flex-wrap: wrap;
      }
      .main-nav button,
      .tabs button,
      .filters button {
        width: auto;
        flex: 1 1 auto;
      }
      .detail-head {
        position: static;
        padding: 12px;
        gap: 10px;
      }
      .detail-head .toolbar > div:first-child { display: grid; gap: 6px; }
      .detail-head .actions button,
      .modal .actions button { width: 100%; }
      .statusline .pill,
      .tabs .tab {
        white-space: normal;
        justify-content: center;
        text-align: center;
      }
      .card-grid { gap: 10px; }
      .model-card {
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 8px 10px;
        min-height: auto;
        padding: 12px;
      }
      .model-card .model-photo,
      .model-card .model-photo-placeholder {
        grid-row: span 6;
        width: 92px;
      }
      .model-card strong,
      .model-card .row,
      .model-card .status-badge,
      .model-card .muted,
      .model-card > .pill {
        min-width: 0;
      }
      .model-card .row {
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .model-card .pill {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .primary-photo-block {
        justify-items: center;
      }
      .photo-preview,
      .primary-photo-block .model-photo-placeholder {
        width: min(220px, 100%);
      }
      .date-row { grid-template-columns: 1fr; }
      .date-item { min-height: 52px; }
      .check-row .pill {
        width: 100%;
        white-space: normal;
        align-items: flex-start;
        border-radius: 8px;
      }
      .table-row,
      .history-row,
      .access-row {
        gap: 8px;
        padding: 10px;
      }
      .table-row button,
      .access-row button { width: 100%; }
      .stat { min-height: 72px; padding: 12px; }
      .stat strong { font-size: 22px; }
      .modal-backdrop {
        align-items: end;
        padding: 8px;
      }
      .modal {
        width: 100%;
        max-height: calc(100vh - 16px);
        overflow: auto;
        padding: 14px;
      }
      .photo-modal { width: 100vw; height: 100vh; }
    }

    @media (max-width: 420px) {
      .model-card {
        grid-template-columns: 76px minmax(0, 1fr);
      }
      .model-card .model-photo,
      .model-card .model-photo-placeholder {
        width: 76px;
      }
      .pill { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <section class="panel login-panel login-brand">
        <div class="brand-stack">
          <span class="brand-kicker">Fashion development CRM</span>
          <h1>CRM моделей одежды</h1>
          <p class="muted">Тихое рабочее пространство для моделей, лекал, образцов, корректировок и градации.</p>
        </div>
        <div class="atelier-board" aria-hidden="true">
          <div class="material-swatch tall">Лекала</div>
          <div class="material-swatch short">Образцы</div>
          <div class="material-swatch mid">Градация</div>
        </div>
      </section>
      <section class="panel login-panel">
        <h2>Вход</h2>
        <p class="muted">Зайдите под своим доступом, чтобы увидеть только свои задачи и модели.</p>
        <div class="grid">
          <label><span>Логин / email</span><input id="loginInput"></label>
          <label><span>Пароль</span><input id="passwordInput" type="password"></label>
        </div>
        <button class="primary" id="loginButton">Войти</button>
        <span class="muted" id="loginError"></span>
      </section>
    </div>
  </div>

  <div class="app-shell hidden" id="appShell">
    <div class="session-bar">
      <div class="row">
        <span class="pill" id="sessionName"></span>
        <span class="pill" id="sessionRole"></span>
      </div>
      <div class="main-nav" id="mainNav"></div>
      <button id="logoutButton">Выйти</button>
    </div>
    <main id="app"></main>
  </div>

  <div class="modal-backdrop hidden" id="modalRoot"></div>

  <script>
    const storeKey = "fashion-crm-local-v3";
    const preRemoteBackupKey = `${storeKey}-before-supabase`;
    const supabaseConfig = {
      url: "__SUPABASE_URL__",
      anonKey: "__SUPABASE_ANON_KEY__"
    };
    let remoteReady = false;
    let remoteLoaded = false;
    let remoteError = "";
    let remoteSaveTimer = null;
    let remoteUpdatedAt = "";
    let lastCloudBackupAt = 0;
    let cloudBackupsRequested = false;
    let accessDraft = null;
    const cloudBackupIntervalMs = 120000;
    const roles = ["Админ", "Владелец бренда/Дизайнер", "Цех", "Конструктор"];
    const users = [
      { id: "u-admin", name: "Админ", login: "admin", email: "admin@fashion-crm.local", password: "admin", role: "Админ", active: true },
      { id: "u-owner", name: "Владелец / дизайнер", login: "owner", email: "owner@fashion-crm.local", password: "owner", role: "Владелец бренда/Дизайнер", active: true },
      { id: "u-workshop", name: "Цех", login: "workshop", email: "workshop@fashion-crm.local", password: "workshop", role: "Цех", active: true },
      { id: "u-constructor", name: "Конструктор", login: "constructor", email: "constructor@fashion-crm.local", password: "constructor", role: "Конструктор", active: true }
    ];
    const baseTabs = ["Основная", "Комментарии", "Оплата конструктора", "Оплата и расход цеха", "История", "Статистика"];
    const statusList = [
      "Черновик", "Новая модель", "Разработка лекал", "Лекала в работе", "Лекала готовы",
      "Передано на градацию", "Градация в работе", "Градация готова", "Завершено", "Удалено из разработки"
    ];
    const today = () => new Date().toISOString().slice(0, 10);
    const addDays = days => { const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); };
    const nowText = () => new Date().toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
    const formatDateTime = value => value ? new Date(value).toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" }) : "-";
    const uid = () => Math.random().toString(36).slice(2, 10);

    const seed = {
      currentUserId: "",
      view: "dashboard",
      allFilter: "process",
      allResponsibleFilter: "",
      statsPeriod: "month",
      activeModelId: "",
      activeTab: "Основная",
      cloudBackups: [],
      cloudBackupError: "",
      syncConflict: false,
      loginEvents: [],
      users,
      models: [
        makeModel({ id: "m-draft", title: "Платье-комбинация", article: "DR-014", status: "Черновик", responsible: "u-owner", deadline: addDays(3), samples: [], corrections: [], unread: { "u-owner": 1 } }),
        makeModel({ id: "m-pattern", title: "Жакет прямого силуэта", article: "JK-001", status: "Лекала в работе", responsible: "u-constructor", deadline: addDays(4), pattern: { sentAt: today(), acceptedAt: today(), deadline: addDays(4), checklist: blankChecklist(), readyAt: "", cost: 0 }, participants: ["u-owner", "u-constructor"] }),
        makeModel({ id: "m-sample", title: "Юбка миди", article: "SK-022", status: "Образец 1 в работе", responsible: "u-workshop", deadline: addDays(2), samples: [sample(1, { status: "Образец 1 в работе", sentAt: today(), acceptedAt: today(), deadline: addDays(2), ownerComment: "Проверить посадку по талии." })], participants: ["u-owner", "u-constructor", "u-workshop"] }),
        makeModel({ id: "m-owner", title: "Брюки палаццо", article: "TR-008", status: "Образец 1 готов", responsible: "u-owner", deadline: addDays(1), samples: [sample(1, { status: "Образец 1 готов", sentAt: today(), acceptedAt: today(), deadline: today(), readyAt: today(), workshopComment: "Образец готов, посадка свободная.", fabricUsage: 2.1, cost: 1700 })], participants: ["u-owner", "u-constructor", "u-workshop"] }),
        makeModel({ id: "m-grade", title: "Рубашка oversize", article: "SH-031", status: "Градация готова", responsible: "u-owner", deadline: today(), grading: { finalName: "Рубашка oversize SH-031", sizes: "XS-XL", comment: "Градация по базовой сетке.", extraComment: "Проверить длину рукава.", sentAt: today(), acceptedAt: today(), deadline: today(), readyAt: today(), checklist: { notches: true, printDetails: true, nameUpdated: true, sentTelegram: true }, cost: 4200 }, participants: ["u-owner", "u-constructor"] })
      ]
    };

    function makeModel(overrides = {}) {
      const model = {
        id: uid(),
        brand: "Не определились",
        photoDataUrl: "",
        title: "Новая модель",
        article: "",
        sizeRange: "XS-L",
        material: "",
        hardware: "",
        description: "",
        important: "",
        gradingComment: "",
        links: [""],
        status: "Черновик",
        currentResponsibleUserId: "u-owner",
        deadline: "",
        createdByUserId: "u-owner",
        ownerUserId: "u-owner",
        constructorUserId: "u-constructor",
        workshopUserId: "u-workshop",
        participants: ["u-owner"],
        createdAt: today(),
        updatedAt: today(),
        deletedReason: "",
        unread: {},
        pattern: { sentAt: "", acceptedAt: "", deadline: "", readyAt: "", checklist: blankChecklist(), cost: 0 },
        samples: [],
        corrections: [],
        grading: { finalName: "", sizes: "", comment: "", extraComment: "", sentAt: "", acceptedAt: "", deadline: "", readyAt: "", checklist: { notches: false, printDetails: false, nameUpdated: false, sentTelegram: false }, cost: 0 },
        payments: {
          constructor: [
            { id: uid(), work: "Разработка лекал", amount: 0, paid: false, paidAt: "" },
            { id: uid(), work: "Градация", amount: 0, paid: false, paidAt: "" }
          ]
        },
        comments: [],
        history: [{ date: nowText(), user: "Система", action: "Создана карточка модели" }]
      };
      return { ...model, ...overrides };
    }

    function blankChecklist() {
      return { notches: false, printDetails: false, signed: false };
    }

    function sample(number, overrides = {}) {
      return {
        id: uid(), number, status: `Отшив образца ${number}`, sentAt: "", acceptedAt: "",
        deadline: "", readyAt: "", ownerComment: "", workshopComment: "", usedHardware: "",
        fabricUsage: 0, cost: 0, paid: false, paidAt: "", ...overrides
      };
    }

    function correction(number, overrides = {}) {
      return {
        id: uid(), number, status: `Поданы корректировки ${number}`, text: "", link: "",
        sentAt: today(), acceptedAt: "", deadline: "", readyAt: "",
        checklist: blankChecklist(), printCost: 0, ...overrides
      };
    }

    let state = load();

    function load() {
      let data;
      try { data = JSON.parse(localStorage.getItem(storeKey)) || structuredClone(seed); }
      catch { data = structuredClone(seed); }
      return normalizeStateData(data);
    }

    function normalizeStateData(data) {
      data.statsPeriod = data.statsPeriod || "month";
      data.allResponsibleFilter = data.allResponsibleFilter || "";
      data.cloudBackups = data.cloudBackups || [];
      data.cloudBackupError = data.cloudBackupError || "";
      data.syncConflict = !!data.syncConflict;
      data.loginEvents = data.loginEvents || [];
      (data.users || []).forEach(user => {
        user.email = user.email || defaultEmailForLogin(user.login);
        user.telegramChatId = user.telegramChatId || "";
        user.telegramEnabled = !!user.telegramEnabled;
      });
      (data.models || []).forEach(model => {
        model.brand = model.brand || "Не определились";
        model.photoDataUrl = model.photoDataUrl || "";
        (model.samples || []).forEach(s => s.usedHardware = s.usedHardware || "");
        (model.corrections || []).forEach(c => c.printCost = Number(c.printCost || 0));
      });
      cleanupTechnicalHistory(data);
      return data;
    }

    function cleanupTechnicalHistory(data) {
      (data.models || []).forEach(model => {
        model.history = (model.history || []).filter(item => !isTechnicalHistory(item));
      });
    }

    function isTechnicalHistory(item) {
      const action = item?.action || "";
      return action.includes('"newComment"') || action.includes('"newUser') || action.includes('"link:');
    }

    function hasSupabase() {
      return supabaseConfig.url.startsWith("http") && supabaseConfig.anonKey && !supabaseConfig.anonKey.includes("__");
    }

    async function supabaseRequest(path, options = {}) {
      const headers = {
        apikey: supabaseConfig.anonKey,
        authorization: `Bearer ${supabaseConfig.anonKey}`,
        "content-type": "application/json",
        ...(options.headers || {})
      };
      const response = await fetch(`${supabaseConfig.url.replace(/\/$/, "")}${path}`, { ...options, headers });
      if (!response.ok) throw new Error(await response.text());
      if (response.status === 204) return null;
      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    async function initRemoteState() {
      if (!hasSupabase()) return;
      try {
        const rows = await supabaseRequest("/rest/v1/crm_state?id=eq.main&select=data,updated_at");
        if (Array.isArray(rows) && rows[0]?.data) {
          backupSharedState(preRemoteBackupKey, "Локальная копия до загрузки Supabase");
          state = normalizeStateData({ ...structuredClone(seed), ...rows[0].data, ...localUiState() });
          remoteUpdatedAt = rows[0].updated_at || "";
          localStorage.setItem(storeKey, JSON.stringify(state));
        } else {
          await saveRemoteNow();
        }
        remoteReady = true;
        remoteLoaded = true;
        remoteError = "";
        state.syncConflict = false;
        render();
      } catch (error) {
        remoteReady = false;
        remoteLoaded = false;
        remoteError = "Supabase недоступен";
        console.warn("Supabase sync failed", error);
        render();
      }
    }

    function persist() {
      localStorage.setItem(storeKey, JSON.stringify(state));
      if (remoteReady && remoteLoaded) queueRemoteSave();
    }

    function queueRemoteSave() {
      clearTimeout(remoteSaveTimer);
      remoteSaveTimer = setTimeout(() => {
        saveRemoteNow().catch(error => {
          remoteReady = false;
          remoteError = state.syncConflict ? "Есть новая версия в Supabase" : "Не сохранено в Supabase";
          console.warn("Supabase save failed", error);
          render();
        });
      }, 500);
    }

    async function saveRemoteNow() {
      if (!hasSupabase()) return;
      await ensureNoRemoteConflict();
      backupSharedState(`${storeKey}-last-cloud-save`, "Копия перед записью в Supabase");
      await createCloudBackup("Автокопия перед записью в Supabase").catch(error => console.warn("Cloud backup failed", error));
      const rows = await supabaseRequest("/rest/v1/crm_state?on_conflict=id&select=updated_at", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=representation" },
        body: JSON.stringify({ id: "main", data: sharedState(), updated_at: new Date().toISOString() })
      });
      remoteUpdatedAt = Array.isArray(rows) ? rows[0]?.updated_at || remoteUpdatedAt : remoteUpdatedAt;
      remoteReady = true;
      remoteLoaded = true;
      state.syncConflict = false;
      localStorage.setItem(storeKey, JSON.stringify(state));
    }

    async function ensureNoRemoteConflict() {
      if (!remoteUpdatedAt) return;
      const rows = await supabaseRequest("/rest/v1/crm_state?id=eq.main&select=updated_at");
      const currentUpdatedAt = Array.isArray(rows) ? rows[0]?.updated_at || "" : "";
      if (currentUpdatedAt && currentUpdatedAt !== remoteUpdatedAt) {
        state.syncConflict = true;
        localStorage.setItem(storeKey, JSON.stringify(state));
        throw new Error("Remote state changed in another browser");
      }
    }

    async function loadLatestRemoteState() {
      if (!hasSupabase()) return;
      const rows = await supabaseRequest("/rest/v1/crm_state?id=eq.main&select=data,updated_at");
      if (!Array.isArray(rows) || !rows[0]?.data) return;
      backupSharedState(preRemoteBackupKey, "Локальная копия до ручной загрузки Supabase");
      state = normalizeStateData({ ...structuredClone(seed), ...rows[0].data, ...localUiState(), syncConflict: false });
      remoteUpdatedAt = rows[0].updated_at || "";
      remoteReady = true;
      remoteLoaded = true;
      remoteError = "";
      localStorage.setItem(storeKey, JSON.stringify(state));
      render();
    }

    async function createCloudBackup(reason, options = {}) {
      if (!hasSupabase()) return false;
      const force = !!options.force;
      const now = Date.now();
      if (!force && now - lastCloudBackupAt < cloudBackupIntervalMs) return false;
      let data = options.data || null;
      if (!data) {
        const rows = await supabaseRequest("/rest/v1/crm_state?id=eq.main&select=data");
        data = Array.isArray(rows) ? rows[0]?.data : null;
      }
      if (!data?.users || !data?.models) return false;
      await supabaseRequest("/rest/v1/crm_backups", {
        method: "POST",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify({ reason, data })
      });
      lastCloudBackupAt = now;
      pruneCloudBackups().catch(error => console.warn("Cloud backup prune failed", error));
      return true;
    }

    async function loadCloudBackups() {
      if (!hasSupabase()) return;
      try {
        const rows = await supabaseRequest("/rest/v1/crm_backups?select=id,reason,created_at,data&order=created_at.desc&limit=20");
        state.cloudBackups = Array.isArray(rows) ? rows : [];
        state.cloudBackupError = "";
        localStorage.setItem(storeKey, JSON.stringify(state));
      } catch (error) {
        state.cloudBackups = [];
        state.cloudBackupError = "Облачные копии пока недоступны. Проверьте, что SQL для crm_backups выполнен в Supabase.";
        console.warn("Cloud backups load failed", error);
      }
    }

    async function pruneCloudBackups() {
      const rows = await supabaseRequest("/rest/v1/crm_backups?select=id&order=created_at.desc&offset=20");
      if (!Array.isArray(rows) || !rows.length) return;
      const ids = rows.map(row => row.id).filter(Boolean).join(",");
      if (!ids) return;
      await supabaseRequest(`/rest/v1/crm_backups?id=in.(${ids})`, { method: "DELETE" });
    }

    function localUiState() {
      return {
        currentUserId: state.currentUserId,
        view: state.view,
        allFilter: state.allFilter,
        allResponsibleFilter: state.allResponsibleFilter,
        statsPeriod: state.statsPeriod,
        activeModelId: state.activeModelId,
        activeTab: state.activeTab,
        cloudBackups: state.cloudBackups,
        cloudBackupError: state.cloudBackupError,
        syncConflict: state.syncConflict
      };
    }

    function sharedState() {
      return {
        users: state.users,
        models: state.models,
        loginEvents: state.loginEvents
      };
    }

    function backupSharedState(key, reason) {
      try {
        localStorage.setItem(key, JSON.stringify({
          reason,
          createdAt: new Date().toISOString(),
          data: sharedState()
        }));
      } catch (error) {
        console.warn("Backup failed", error);
      }
    }

    function readBackup(key) {
      try { return JSON.parse(localStorage.getItem(key) || "null"); }
      catch { return null; }
    }

    function applySharedData(data) {
      if (!data?.users || !data?.models) return false;
      state = normalizeStateData({ ...state, users: data.users, models: data.models, loginEvents: data.loginEvents || state.loginEvents || [] });
      persist();
      return true;
    }

    persist();
    function currentUser() { return state.users.find(u => u.id === state.currentUserId) || null; }
    function currentModel() { return state.models.find(m => m.id === state.activeModelId) || null; }
    function userName(id) { return state.users.find(u => u.id === id)?.name || "Не назначен"; }
    function roleOf(id) { return state.users.find(u => u.id === id)?.role || ""; }
    function isAdmin() { return currentUser()?.role === "Админ"; }
    function isOwner() { return currentUser()?.role === "Владелец бренда/Дизайнер"; }
    function canEditPrimary() { return isAdmin() || isOwner(); }
    function canPay() { return isAdmin() || isOwner(); }
    function canViewGlobalStats() { return isAdmin() || isOwner(); }
    function money(v) { return Number(v || 0).toLocaleString("ru-RU") + " грн"; }
    function inProcess(m) { return !["Завершено", "Удалено из разработки"].includes(m.status); }
    function isDeleted(m) { return m.status === "Удалено из разработки"; }
    function hasAccess(m, user = currentUser()) {
      if (!user) return false;
      if (user.role === "Админ" || user.role === "Владелец бренда/Дизайнер") return true;
      if (isDeleted(m)) return false;
      return m.participants.includes(user.id);
    }
    function dashboardModels() {
      const user = currentUser();
      if (!user) return [];
      return state.models.filter(m => hasAccess(m, user) && inProcess(m) && m.currentResponsibleUserId === user.id);
    }
    function allModels() {
      return state.models.filter(m => {
        if (!hasAccess(m)) return false;
        if (state.allResponsibleFilter && m.currentResponsibleUserId !== state.allResponsibleFilter) return false;
        if (state.allFilter === "process") return inProcess(m);
        if (state.allFilter === "archive") return !inProcess(m);
        return true;
      });
    }
    function allowedTabs() {
      const role = currentUser()?.role;
      if (role === "Конструктор") return ["Основная", "Комментарии", "Оплата конструктора"];
      if (role === "Цех") return ["Основная", "Комментарии", "Оплата и расход цеха"];
      return baseTabs;
    }
    function addHistory(model, action, details = null) {
      model.history.unshift({ date: nowText(), user: currentUser()?.name || "Система", action, details });
      model.updatedAt = today();
    }
    function changeStatus(model, nextStatus, action) {
      const previousStatus = model.status;
      model.status = nextStatus;
      addHistory(model, action, previousStatus !== nextStatus ? { from: previousStatus, to: nextStatus } : null);
    }
    function historyDetails(details) {
      if (!details) return "";
      if (details.field) return `<small>${escapeHtml(details.field)}: ${escapeHtml(details.from || "-")} → ${escapeHtml(details.to || "-")}</small>`;
      if ("from" in details || "to" in details) return `<small>${escapeHtml(details.from || "-")} → ${escapeHtml(details.to || "-")}</small>`;
      return "";
    }
    function addParticipant(model, userId) {
      if (userId && !model.participants.includes(userId)) model.participants.push(userId);
    }
    function replaceParticipantByRole(model, userId, role) {
      model.participants = model.participants.filter(id => roleOf(id) !== role);
      addParticipant(model, userId);
    }
    function unreadCount(model) {
      return Number(model.unread?.[currentUser()?.id] || 0);
    }
    function deadlineState(date) {
      if (!date) return { label: "без дедлайна", cls: "" };
      const diff = Math.ceil((new Date(date) - new Date(today())) / 86400000);
      if (diff < 0) return { label: "просрочено", cls: "danger" };
      if (diff <= 1) return { label: "1 день", cls: "danger" };
      if (diff === 2) return { label: "2 дня", cls: "warn" };
      return { label: "в срок", cls: "ok" };
    }

    function correctionPrintTotal(model) {
      return (model.corrections || []).reduce((sum, c) => sum + Number(c.printCost || 0), 0);
    }

    function statusClass(status) {
      const text = String(status || "").toLowerCase();
      if (text === "удалено из разработки") return "status-deleted";
      if (text === "завершено") return "status-finished";
      if (text === "черновик" || text === "новая модель") return "status-draft";
      if (text.includes("лекал")) return text.includes("готов") ? "status-ready" : "status-pattern";
      if (text.includes("образца") || text.includes("образец")) return text.includes("готов") ? "status-ready" : "status-sample";
      if (text.includes("корректиров")) return text.includes("готов") ? "status-ready" : "status-correction";
      if (text.includes("градац")) return text.includes("готов") ? "status-ready" : "status-grading";
      return "status-draft";
    }

    function statusBadge(status, extra = "") {
      return `<span class="pill status-badge ${statusClass(status)} ${extra}">${escapeHtml(status || "-")}</span>`;
    }

    function patternNameUpdatedLabel(model) {
      const name = model.grading?.finalName || model.title || "название модели";
      const article = model.article || "артикул";
      return `Название на лекалах обновлено на ${name}, ${article}`;
    }

    function render() {
      renderShell();
      renderLogin();
      if (!currentUser()) return;
      if (state.view === "detail" && currentModel()) renderDetail();
      else renderHome();
    }

    function renderShell() {
      const user = currentUser();
      document.getElementById("loginScreen").classList.toggle("hidden", !!user);
      document.getElementById("appShell").classList.toggle("hidden", !user);
      if (!user) return;
      if (state.view === "stats" && !canViewGlobalStats()) state.view = "dashboard";
      if (state.view === "access" && !isAdmin()) state.view = "dashboard";
      document.getElementById("sessionName").textContent = user.name;
      document.getElementById("sessionRole").textContent = user.role;
      document.getElementById("mainNav").innerHTML = `
        <span class="pill ${remoteReady ? "ok" : remoteError ? "danger" : ""}">${hasSupabase() ? (remoteReady ? "Онлайн база" : remoteError || "Подключение") : "Локальный режим"}</span>
        ${hasSupabase() ? `<span class="pill ok">CRM доступ</span>` : ""}
        ${state.syncConflict ? `<button class="danger" id="loadLatestRemote">Загрузить новую версию</button>` : ""}
        <button class="nav-btn ${state.view === "dashboard" ? "active" : ""}" data-view="dashboard">Dashboard</button>
        <button class="nav-btn ${state.view === "all" ? "active" : ""}" data-view="all">Все модели</button>
        ${canViewGlobalStats() ? `<button class="nav-btn ${state.view === "stats" ? "active" : ""}" data-view="stats">Статистика</button>` : ""}
        ${isAdmin() ? `<button class="nav-btn ${state.view === "access" ? "active" : ""}" data-view="access">Доступы</button>` : ""}
      `;
      document.querySelectorAll("[data-view]").forEach(btn => btn.onclick = () => {
        state.view = btn.dataset.view;
        state.activeModelId = "";
        persist();
        render();
      });
      const latest = document.getElementById("loadLatestRemote");
      if (latest) latest.onclick = () => {
        if (!confirm("В Supabase есть более новая версия. Загрузить ее? Текущие несохраненные изменения останутся только в локальной резервной копии.")) return;
        loadLatestRemoteState().catch(error => {
          console.warn(error);
          alert("Не удалось загрузить новую версию");
        });
      };
    }

    function renderLogin() {
      const quickLogins = document.getElementById("quickLogins");
      if (!quickLogins) return;
      if (hasSupabase()) {
        quickLogins.innerHTML = `
          <div class="empty">Вход по доступу, созданному администратором в CRM</div>
        `;
        return;
      }
      quickLogins.innerHTML = state.users.filter(u => u.active).map(u => `
        <button class="quick-login" data-login="${u.id}">
          <strong>${escapeHtml(u.role)}</strong>
          <span class="muted">${escapeHtml(u.email || u.login)} / ${escapeHtml(u.password)}</span>
        </button>
      `).join("");
      document.querySelectorAll("[data-login]").forEach(btn => btn.onclick = () => loginAs(btn.dataset.login));
    }

    function renderHome() {
      const app = document.getElementById("app");
      app.innerHTML = `<div class="workspace">${state.view === "access" ? accessView() : state.view === "stats" ? globalStatsView() : state.view === "all" ? allView() : dashboardView()}</div>`;
      bindHome();
    }

    function dashboardView() {
      const mine = dashboardModels();
      const user = currentUser();
      const visible = state.models.filter(m => hasAccess(m));
      const overdue = mine.filter(m => deadlineState(m.deadline).cls === "danger").length;
      const soon = mine.filter(m => deadlineState(m.deadline).cls === "warn").length;
      return `
        ${welcomePanel(user, mine, visible, overdue, soon)}
        <section class="panel">
          ${state.syncConflict ? `<div class="mini-block sync-warning"><span class="mini-title">Данные изменились в другой вкладке</span><p>Сохранение остановлено, чтобы не перезаписать чужие изменения. Нажмите “Загрузить новую версию” сверху.</p></div>` : ""}
          <div class="toolbar">
            <div>
              <h2>Dashboard</h2>
              <p class="muted">Сверху краткая сводка, ниже модели, где сейчас ожидается ваше действие.</p>
            </div>
            ${(isOwner() || isAdmin()) ? `<button class="primary" id="newModel">Создать модель</button>` : ""}
          </div>
          <div class="stat-grid">
            ${stat(mine.length, "на мне сейчас")}
            ${stat(visible.filter(inProcess).length, "в процессе")}
            ${stat(overdue, "просрочено")}
            ${stat(visible.filter(m => unreadCount(m)).length, "с новыми комментариями")}
          </div>
        </section>
        <section class="panel">
          <h3>Модели на мне</h3>
          <div class="card-grid">${mine.map(modelCard).join("") || `<div class="empty">Сейчас на вас нет задач</div>`}</div>
        </section>
      `;
    }

    function welcomePanel(user, mine, visible, overdue, soon) {
      const roleText = roleWelcome(user.role);
      const firstAction = mine[0];
      return `
        <section class="panel welcome-panel">
          <div class="welcome-copy">
            <span class="brand-kicker">${escapeHtml(dayGreeting())}</span>
            <h2>${escapeHtml(user.name)}, ${escapeHtml(roleText.title)}</h2>
            <p class="muted">${escapeHtml(roleText.text)}</p>
            <div class="focus-strip">
              <span class="pill ok">${mine.length} задач на вас</span>
              <span class="pill ${overdue ? "danger" : "ok"}">${overdue} срочно</span>
              <span class="pill ${soon ? "warn" : "ok"}">${soon} скоро дедлайн</span>
              <span class="pill">${visible.filter(m => unreadCount(m)).length} с новыми комментариями</span>
            </div>
            ${firstAction ? `<div class="focus-card"><strong>Начать можно с: ${escapeHtml(firstAction.title || "Без названия")}</strong><span class="muted">${escapeHtml(firstAction.status)} · дедлайн ${escapeHtml(firstAction.deadline || "не задан")}</span></div>` : `<div class="focus-card"><strong>Сейчас на вас нет зависших задач</strong><span class="muted">Можно спокойно посмотреть все модели или новые комментарии.</span></div>`}
          </div>
          <div class="mood-board" aria-hidden="true">
            <div class="mood-tile">Идея</div>
            <div class="mood-tile">Лекала</div>
            <div class="mood-tile">Образец</div>
            <div class="mood-tile">Правки</div>
            <div class="mood-tile">Цех</div>
            <div class="mood-tile">Финал</div>
          </div>
        </section>
      `;
    }

    function dayGreeting() {
      const hour = new Date().getHours();
      if (hour < 6) return "Доброй ночи";
      if (hour < 12) return "Доброе утро";
      if (hour < 18) return "Добрый день";
      return "Добрый вечер";
    }

    function roleWelcome(role) {
      if (role === "Админ") return { title: "система под контролем", text: "Сверху видны доступы, резервные копии и состояние базы. Рабочие модели остаются на виду." };
      if (role === "Владелец бренда/Дизайнер") return { title: "сегодня держим разработку в ритме", text: "Здесь собраны модели, где нужно принять решение, передать задачу или проверить результат." };
      if (role === "Конструктор") return { title: "ваши лекала и корректировки собраны здесь", text: "CRM показывает только задачи, где сейчас ожидается ваша работа или финальная отметка." };
      if (role === "Цех") return { title: "ваши образцы ждут аккуратного финиша", text: "На дашборде видны модели, которые сейчас находятся на отшиве или сдаче образца." };
      return { title: "приятной работы", text: "Все нужные задачи и модели собраны на этом экране." };
    }

    function allView() {
      return `
        <section class="panel">
          <div class="toolbar">
            <div>
              <h2>Все модели</h2>
              <p class="muted">Короткие карточки моделей. Детали открываются по клику.</p>
            </div>
            <div class="filters">
              <button class="${state.allFilter === "process" ? "dark" : ""}" data-filter="process">В процессе</button>
              <button class="${state.allFilter === "archive" ? "dark" : ""}" data-filter="archive">Архив</button>
              <button class="${state.allFilter === "all" ? "dark" : ""}" data-filter="all">Все</button>
              <select id="responsibleFilter">
                <option value="">Все ответственные</option>
                ${state.users.filter(u => u.active).map(u => `<option value="${u.id}" ${state.allResponsibleFilter === u.id ? "selected" : ""}>${escapeHtml(u.name)}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="card-grid">${allModels().map(modelCard).join("") || `<div class="empty">Модели не найдены</div>`}</div>
        </section>
      `;
    }

    function globalStatsView() {
      if (!canViewGlobalStats()) return `<section class="panel"><div class="empty">Нет доступа</div></section>`;
      const models = modelsForStatsPeriod();
      const inWork = models.filter(inProcess);
      const done = models.filter(m => m.status === "Завершено");
      const constructorTotal = models.reduce((sum, m) => sum + m.payments.constructor.reduce((s, p) => s + Number(p.amount || 0), 0), 0);
      const workshopTotal = models.reduce((sum, m) => sum + m.samples.filter(s => s.readyAt).reduce((s, sample) => s + Number(sample.cost || 0), 0), 0);
      const totalSpent = constructorTotal + workshopTotal;
      return `
        <section class="panel">
          <div class="toolbar">
            <div>
              <h2>Статистика</h2>
              <p class="muted">Общая статистика видна только владельцу/дизайнеру и админу.</p>
            </div>
            <div class="filters">
              <button class="${state.statsPeriod === "week" ? "dark" : ""}" data-stats-period="week">Неделя</button>
              <button class="${state.statsPeriod === "month" ? "dark" : ""}" data-stats-period="month">Месяц</button>
              <button class="${state.statsPeriod === "all" ? "dark" : ""}" data-stats-period="all">Все</button>
            </div>
          </div>
          <div class="stat-grid">
            ${stat(inWork.length, "моделей в разработке")}
            ${stat(done.length, "готовых моделей")}
            ${stat(money(totalSpent), "потрачено всего")}
            ${stat(models.length, "моделей в периоде")}
          </div>
        </section>
        <section class="panel">
          <h3>Модели за период</h3>
          <div class="card-grid">${models.map(modelCard).join("") || `<div class="empty">За выбранный период моделей нет</div>`}</div>
        </section>
      `;
    }

    function modelsForStatsPeriod() {
      if (state.statsPeriod === "all") return state.models.filter(m => !isDeleted(m));
      const days = state.statsPeriod === "week" ? 7 : 30;
      const from = new Date();
      from.setDate(from.getDate() - days);
      return state.models.filter(m => !isDeleted(m) && new Date(m.createdAt) >= from);
    }

    function accessView() {
      if (!isAdmin()) return `<section class="panel"><div class="empty">Нет доступа</div></section>`;
      return `
        <section class="panel">
          <div>
            <h2>Доступы</h2>
            <p class="muted">Создание пользователей, смена ролей и отключение доступов.</p>
          </div>
        </section>
        ${accessTab()}
        ${loginEventsTab()}
        ${backupTab()}
      `;
    }

    function modelCard(m) {
      const d = deadlineState(m.deadline);
      const unread = unreadCount(m);
      return `
        <button class="model-card ${d.cls ? "deadline-" + d.cls : ""}" data-open="${m.id}">
          ${modelPhotoThumb(m)}
          <strong>${escapeHtml(m.title || "Без названия")}</strong>
          <div class="row">
            <span class="pill">${escapeHtml(m.article || "без артикула")}</span>
            ${unread ? `<span class="pill warn">${unread} новых</span>` : ""}
          </div>
          ${statusBadge(m.status)}
          <span class="muted">Ответственный: ${escapeHtml(userName(m.currentResponsibleUserId))}</span>
          <span class="pill"><span class="dot ${d.cls}"></span>${d.label}: ${m.deadline || "-"}</span>
        </button>
      `;
    }

    function bindHome() {
      bindPhotoOpeners();
      document.querySelectorAll("[data-open]").forEach(btn => btn.onclick = () => {
        state.activeModelId = btn.dataset.open;
        state.view = "detail";
        state.activeTab = "Основная";
        persist();
        render();
      });
      document.querySelectorAll("[data-filter]").forEach(btn => btn.onclick = () => {
        state.allFilter = btn.dataset.filter;
        persist();
        render();
      });
      const responsibleFilter = document.getElementById("responsibleFilter");
      if (responsibleFilter) responsibleFilter.onchange = () => {
        state.allResponsibleFilter = responsibleFilter.value;
        persist();
        render();
      };
      document.querySelectorAll("[data-stats-period]").forEach(btn => btn.onclick = () => {
        state.statsPeriod = btn.dataset.statsPeriod;
        persist();
        render();
      });
      const newBtn = document.getElementById("newModel");
      if (newBtn) newBtn.onclick = createModel;
      bindAccess();
    }

    function renderDetail() {
      const m = currentModel();
      const tabs = allowedTabs();
      if (!tabs.includes(state.activeTab)) state.activeTab = tabs[0];
      if (state.activeTab === "Комментарии") {
        m.unread[currentUser().id] = 0;
        persist();
      }
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="detail-head">
          <div class="toolbar">
            <div>
              <button id="backHome">← На главную</button>
              <h2>${escapeHtml(m.title || "Без названия")}</h2>
              <p class="muted">${escapeHtml(m.article || "без артикула")}</p>
            </div>
            <div class="actions">${actionButtons(m)}</div>
          </div>
          <div class="statusline">
            ${statusBadge(m.status, "status-main")}
            <span class="pill">Ответственный: ${escapeHtml(userName(m.currentResponsibleUserId))}</span>
            <span class="pill">Дедлайн: ${m.deadline || "-"}</span>
            <span class="pill">Создано: ${m.createdAt}</span>
          </div>
          <div class="tabs">${tabs.map(t => `<button class="tab ${state.activeTab === t ? "active" : ""}" data-tab="${t}">${tabTitle(t, m)}</button>`).join("")}</div>
        </div>
        <div class="workspace">${detailTab(m)}</div>
      `;
      bindDetail();
    }

    function detailTab(m) {
      if (state.activeTab === "Основная") return mainTab(m);
      if (state.activeTab === "Комментарии") return commentsTab(m);
      if (state.activeTab === "Оплата конструктора") return constructorPayTab(m);
      if (state.activeTab === "Оплата и расход цеха") return workshopPayTab(m);
      if (state.activeTab === "История") return historyTab(m);
      if (state.activeTab === "Статистика") return statsTab(m);
      return "";
    }

    function tabTitle(tab, model) {
      if (tab !== "Комментарии") return escapeHtml(tab);
      const count = unreadCount(model);
      return `Комментарии${count ? ` <span class="pill warn">${count}</span>` : ""}`;
    }

    function mainTab(m) {
      return `
        <section class="section">
          <div class="toolbar">
            <h3>Исполнители</h3>
            <span class="muted">${canEditPrimary() ? "Выбираются владельцем или админом" : "Только просмотр"}</span>
          </div>
          <div class="grid">
            ${selectUserField("constructorUserId", "Конструктор", "Конструктор", m.constructorUserId)}
            ${selectUserField("workshopUserId", "Цех", "Цех", m.workshopUserId)}
          </div>
        </section>
        <section class="section">
          <div class="toolbar">
            <h3>Первичные данные</h3>
            <span class="muted">${canEditPrimary() ? "Можно редактировать" : "Только просмотр"}</span>
          </div>
          <div class="primary-layout">
            ${modelPhotoSection(m)}
            <div class="primary-fields">
              <div class="primary-row">
                ${selectField("brand", "Бренд", m.brand, ["MOOW", "LEXIE", "Не определились"])}
                ${field("article", "Артикул", m.article)}
                ${field("title", "Название модели", m.title)}
                ${field("sizeRange", "Размерный ряд", m.sizeRange)}
              </div>
              <div class="grid">
                ${field("material", "Материал", m.material)}
                ${field("hardware", "Фурнитура", m.hardware)}
              </div>
              ${area("description", "Описание", m.description)}
              ${area("important", "Детали", m.important)}
              ${area("gradingComment", "Первый комментарий по градации", m.gradingComment)}
            </div>
          </div>
          <div class="subsection">
            <div class="toolbar"><h3>Ссылки на фото/видео</h3>${canEditPrimary() ? `<button id="addLink">+ Добавить ссылку</button>` : ""}</div>
            <div class="grid">${m.links.map((link, i) => field(`link:${i}`, `Ссылка ${i + 1}`, link)).join("")}</div>
          </div>
        </section>
        ${m.pattern.sentAt ? patternBlock(m) : ""}
        ${timelineBlocks(m)}
        ${m.grading.sentAt ? gradingBlock(m) : ""}
        ${isAdmin() ? adminBlock(m) : ""}
      `;
    }

    function timelineBlocks(m) {
      const max = Math.max(m.samples.length, m.corrections.length);
      const blocks = [];
      for (let i = 1; i <= max; i += 1) {
        const sampleItem = m.samples.find(s => s.number === i);
        const correctionItem = m.corrections.find(c => c.number === i);
        if (sampleItem) blocks.push(sampleBlock(sampleItem));
        if (correctionItem) blocks.push(correctionBlock(correctionItem));
      }
      return blocks.join("");
    }

    function patternBlock(m) {
      return `
        <section class="section">
          <h3>Разработка лекал</h3>
          ${datesMiniBlock([
            ["Передано конструктору", m.pattern.sentAt],
            ["Взято в работу", m.pattern.acceptedAt],
            ["Дедлайн", m.pattern.deadline],
            ["Фактическая дата сдачи", m.pattern.readyAt]
          ])}
          ${statusMiniBlock(m.status)}
          ${checksMiniBlock([
            ["Проставлены все надсечки", m.pattern.checklist.notches],
            ["Все детали есть в печати", m.pattern.checklist.printDetails],
            [`На лекалах подписан артикул и название (${m.title} ${m.article})`, m.pattern.checklist.signed]
          ])}
        </section>
      `;
    }

    function sampleBlock(s) {
      return `
        <section class="section">
          <h3>Образец ${s.number}</h3>
          ${datesMiniBlock([
            ["Передано в цех", s.sentAt],
            ["Взято в работу", s.acceptedAt],
            ["Дедлайн", s.deadline],
            ["Фактическая дата сдачи", s.readyAt]
          ])}
          ${statusMiniBlock(s.status)}
          ${textMiniBlock(`Комментарий для цеха к образцу ${s.number}`, s.ownerComment, "owner-note")}
          ${s.readyAt ? textMiniBlock(`Комментарий цеха после отшива ${s.number} образца`, s.workshopComment, "workshop-note") : ""}
          ${s.readyAt ? textMiniBlock("Использованная фурнитура", s.usedHardware, "workshop-note") : ""}
        </section>
      `;
    }

    function correctionBlock(c) {
      return `
        <section class="section">
          <h3>Корректировки ${c.number}</h3>
          ${datesMiniBlock([
            ["Поданы", c.sentAt],
            ["Взято в работу", c.acceptedAt],
            ["Дедлайн", c.deadline],
            ["Фактическая дата сдачи", c.readyAt]
          ])}
          ${statusMiniBlock(c.status)}
          ${textMiniBlock(`Корректировки ${c.number}`, c.text, "correction-note")}
          ${textMiniBlock("Ссылка на фото/видео корректировок", c.link, "link-note")}
          ${checksMiniBlock([
            ["Проставлены все надсечки", c.checklist.notches],
            ["Все детали есть в печати", c.checklist.printDetails],
            ["На лекалах подписан артикул и название модели", c.checklist.signed]
          ])}
        </section>
      `;
    }

    function gradingBlock(m) {
      const g = m.grading;
      return `
        <section class="section">
          <h3>Градация</h3>
          ${datesMiniBlock([
            ["Передано на градацию", g.sentAt],
            ["Взято в работу", g.acceptedAt],
            ["Дедлайн", g.deadline],
            ["Фактическая дата сдачи", g.readyAt]
          ])}
          ${statusMiniBlock(m.status)}
          <div class="mini-block">
            <span class="mini-title">Данные градации</span>
            <div class="date-row">
              ${dateItem("Финальное название", g.finalName)}
              ${dateItem("Актуальные размеры", g.sizes)}
            </div>
          </div>
          ${textMiniBlock("Обновленный комментарий по градации", g.comment)}
          ${textMiniBlock("Дополнительный комментарий", g.extraComment)}
          ${checksMiniBlock([
            ["Проставлены все надсечки", g.checklist.notches],
            ["Все детали есть в печати", g.checklist.printDetails],
            [patternNameUpdatedLabel(m), g.checklist.nameUpdated],
            ["Файл лекал отправлен в Telegram с артикулом и названием", g.checklist.sentTelegram]
          ])}
        </section>
      `;
    }

    function adminBlock(m) {
      return `
        <section class="section">
          <h3>Администрирование заявки</h3>
          <div class="grid three">
            <label><span>Статус</span><select id="adminStatus">${adminStatuses(m).map(s => `<option ${s === m.status ? "selected" : ""}>${s}</option>`).join("")}</select></label>
            <label><span>Ответственный</span><select id="adminResponsible">${state.users.filter(u => u.active).map(u => `<option value="${u.id}" ${u.id === m.currentResponsibleUserId ? "selected" : ""}>${u.name}</option>`).join("")}</select></label>
            <label><span>Дедлайн</span><input id="adminDeadline" type="date" value="${m.deadline || ""}"></label>
          </div>
          <div class="actions">
            <button class="primary" id="adminSave">Сохранить статус</button>
            ${!isDeleted(m) ? `<button class="danger" id="deleteModel">Удалить из разработки</button>` : ""}
          </div>
        </section>
      `;
    }

    function adminStatuses(m) {
      const dynamic = [];
      m.samples.forEach(s => dynamic.push(`Отшив образца ${s.number}`, `Образец ${s.number} в работе`, `Образец ${s.number} готов`));
      m.corrections.forEach(c => dynamic.push(`Поданы корректировки ${c.number}`, `Корректировки ${c.number} в работе`, `Корректировки ${c.number} готовы`));
      return [...new Set([...statusList, ...dynamic])];
    }

    function commentsTab(m) {
      m.unread[currentUser().id] = 0;
      persist();
      return `
        <section class="section">
          <h3>Комментарии</h3>
          <div class="chat">
            ${m.comments.map(c => `
              <div class="comment">
                <div class="comment-head"><span>${escapeHtml(c.author)}</span><span>${escapeHtml(c.date)}</span></div>
                <p>${escapeHtml(c.text)}</p>
              </div>
            `).join("") || `<div class="empty">Комментариев пока нет</div>`}
            ${area("newComment", "Новый комментарий", "", "")}
            <button class="primary" id="sendComment">Отправить</button>
          </div>
        </section>
      `;
    }

    function constructorPayTab(m) {
      const patternTotal = Number(m.payments.constructor[0]?.amount || 0);
      const gradingTotal = Number(m.payments.constructor[1]?.amount || 0);
      const printTotal = correctionPrintTotal(m);
      const total = patternTotal + printTotal + gradingTotal;
      return `
        <section class="section">
          <h3>Оплата конструктора</h3>
          <div class="pay-summary">
            ${stat(money(patternTotal), "лекала")}
            ${stat(money(printTotal), "печать")}
            ${stat(money(gradingTotal), "градация")}
            ${stat(money(total), "общая сумма", "total")}
          </div>
          ${m.payments.constructor.map((p, index) => payRow(p, "constructor", index)).join("")}
        </section>
      `;
    }

    function workshopPayTab(m) {
      const ready = m.samples.filter(s => s.readyAt);
      return `
        <section class="section">
          <h3>Оплата и расход цеха</h3>
          ${ready.map((s, index) => samplePayRow(s, index)).join("") || `<div class="empty">Оплат по образцам пока нет</div>`}
        </section>
      `;
    }

    function historyTab(m) {
      const history = (m.history || []).filter(item => !isTechnicalHistory(item));
      return `
        <section class="section">
          <h3>История</h3>
          ${history.map(h => `<div class="history-row"><span class="muted">${escapeHtml(h.date)}</span><strong>${escapeHtml(h.action)}${historyDetails(h.details)}</strong><span class="muted">${escapeHtml(h.user)}</span></div>`).join("")}
        </section>
      `;
    }

    function statsTab(m) {
      const constructorTotal = m.payments.constructor.reduce((s, p) => s + Number(p.amount || 0), 0);
      const readySamples = m.samples.filter(s => s.readyAt);
      const workshopTotal = readySamples.reduce((s, p) => s + Number(p.cost || 0), 0);
      const fabric = readySamples.reduce((s, p) => s + Number(p.fabricUsage || 0), 0);
      const days = Math.max(1, Math.ceil((new Date(today()) - new Date(m.createdAt)) / 86400000) + 1);
      return `
        <section class="section">
          <h3>Статистика</h3>
          <div class="stat-grid">
            ${stat(readySamples.length, "образцов отшито")}

      const preRemote = readBackup(preRemoteBackupKey);
      const lastCloud = readBackup(`${storeKey}-last-cloud-save`);

        <section class="section">
          <h3>Резервная копия</h3>

    function cloudBackupsList() {
      const rows = state.cloudBackups || [];
      if (!hasSupabase()) return `<div class="empty">CRM сейчас в локальном режиме</div>`;
      if (!rows.length) return `<div class="empty">Облачных копий пока нет</div>`;
      return `
        <div class="backup-list">
          ${rows.map(backup => `
            <div class="table-row">
              <strong>${escapeHtml(formatDateTime(backup.created_at))}</strong>
              <span>${escapeHtml(backup.reason || "Автокопия")}</span>
              <span>${(backup.data?.models || []).length} моделей</span>
              <span>${(backup.data?.users || []).length} доступов</span>
              <button data-restore-cloud="${escapeAttr(backup.id)}">Восстановить</button>

          `).join("")}
        </div>
      `;
