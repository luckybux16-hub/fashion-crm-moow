<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM моделей одежды</title>
  <style>
    :root {
      --bg: #f4f3ef;
      --panel: #fff;
      --soft: #faf9f6;
      --text: #202522;
      --muted: #6f7671;
      --line: #ddd8cf;
      --accent: #177366;
      --ink: #1f2d2a;
      --warn: #b87512;
      --danger: #b74742;
      --ok: #2d8550;
      --shadow: 0 18px 45px rgba(32, 37, 34, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    button, input, textarea, select { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 7px;
      min-height: 38px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:hover { border-color: #b7b0a6; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
    button.danger { color: var(--danger); border-color: rgba(183, 71, 66, .45); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .filters button { min-width: 104px; justify-content: center; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 10px 11px;
      min-height: 40px;
      color: var(--text);
    }
    input[type="checkbox"] { width: 18px; min-height: 18px; }
    textarea { resize: vertical; min-height: 78px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 650; }
    label.check { grid-template-columns: 20px 1fr; align-items: center; color: var(--text); }

    .hidden { display: none !important; }
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-card { width: min(920px, 100%); display: grid; grid-template-columns: 1fr 1.15fr; gap: 18px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }
    .panel.flat { box-shadow: none; }
    .login-panel { align-content: start; }
    .login-brand {
      position: relative;
      overflow: hidden;
      min-height: 360px;
      align-content: space-between;
      background:
        linear-gradient(135deg, rgba(23,115,102,.08), rgba(255,255,255,0) 38%),
        linear-gradient(315deg, rgba(103,65,159,.08), rgba(255,255,255,0) 42%),
        #fff;
    }
    .brand-stack { display: grid; gap: 10px; max-width: 420px; }
    .brand-kicker { color: var(--accent); font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
    .atelier-board {
      display: grid;
      grid-template-columns: 1.2fr .8fr 1fr;
      gap: 10px;
      align-items: end;
      min-height: 150px;
    }
    .material-swatch {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(32,37,34,.08);
      min-height: 90px;
      display: grid;
      align-content: end;
      padding: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }
    .material-swatch.tall { min-height: 138px; background: #f5fbf8; border-color: rgba(23,115,102,.24); }
    .material-swatch.mid { min-height: 112px; background: #f7f2fb; border-color: rgba(103,65,159,.22); }
    .material-swatch.short { min-height: 82px; background: #fff9ec; border-color: rgba(184,117,18,.24); }
    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 30px; }
    h2 { font-size: 25px; }
    h3 { font-size: 16px; }
    p { margin: 0; line-height: 1.45; }
    .muted { color: var(--muted); font-size: 13px; }
    .quick-logins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .quick-login { text-align: left; min-height: 76px; display: grid; gap: 4px; align-content: center; }

    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .session-bar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .main-nav, .row, .toolbar, .statusline, .tabs, .actions, .filters { display: flex; align-items: center; gap: 8px; }
    .main-nav { flex-wrap: wrap; }
    .nav-btn.active, .tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .workspace { width: min(1280px, 100%); margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
    .toolbar { justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .link-list { display: grid; gap: 10px; }
    .link-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: end; gap: 8px; }
    .link-row a {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid rgba(23, 115, 102, .25);
      border-radius: 8px;
      background: #f6fbf9;
      color: #177366;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
    }
    .empty-links { border: 1px dashed var(--line); border-radius: 8px; padding: 12px; color: var(--muted); font-weight: 750; }
    .primary-row { display: grid; grid-template-columns: 1fr 118px 2fr 1fr; gap: 12px; align-items: end; }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }

    .stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .stat-grid + .stat-grid { margin-top: 12px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-height: 82px; }
    .stat strong { display: block; font-size: 26px; line-height: 1.1; margin-bottom: 6px; overflow-wrap: anywhere; }
    .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .model-card {
      text-align: left;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 150px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .model-card:hover { box-shadow: var(--shadow); border-color: #b9b2a7; }
    .model-card.deadline-warn { background: #fff9eb; border-color: rgba(184, 117, 18, .38); }
    .model-card.deadline-danger { background: #fff0ee; border-color: rgba(183, 71, 66, .35); }
    .model-card strong { font-size: 16px; overflow-wrap: anywhere; }
    .photo-frame { position: relative; display: block; width: 100%; }
    .model-photo {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--soft);
      display: block;
    }
    .model-photo-placeholder {
      width: 100%;
      aspect-ratio: 2 / 3;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px dashed var(--line);
      background: var(--soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }
    .photo-open-control {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(34, 34, 34, .18);
      background: rgba(255, 255, 255, .92);
      color: var(--ink);
      box-shadow: 0 8px 18px rgba(34,34,34,.14);
      font-size: 22px;
      line-height: 1;
      font-weight: 800;
      cursor: zoom-in;
    }
    .photo-open-control:hover { background: #fff; transform: translateY(-1px); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      min-height: 26px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      max-width: 100%;
    }
    .pill.danger { color: var(--danger); border-color: rgba(183,71,66,.35); }
    .pill.ok { color: var(--ok); border-color: rgba(45,133,80,.35); }
    .pill.warn { color: var(--warn); border-color: rgba(184,117,18,.35); }
    .status-badge {
      color: #17201d;
      border-width: 1px;
      border-style: solid;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.45);
    }
    .status-draft { background: #f1ece3; border-color: #cfc6b8; }
    .status-pattern { background: #dcefeb; border-color: #9dcac1; }
    .status-sample { background: #e7edf8; border-color: #aabde0; }
    .status-correction { background: #f4e7f1; border-color: #d5aecb; }
    .status-grading { background: #eee8fb; border-color: #bcaedf; }
    .status-ready { background: #e2f1e7; border-color: #9fcaad; }
    .status-finished { background: #dfece4; border-color: #8fb89d; }
    .status-deleted { background: #f7e2df; border-color: #d89993; color: #7e2722; }
    .status-main {
      min-height: 34px;
      padding: 7px 12px;
      font-size: 13px;
    }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--muted); flex: 0 0 auto; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.danger { background: var(--danger); }

    .detail-head {
      display: grid;
      gap: 12px;
      background: rgba(244, 243, 239, .95);
      border-bottom: 1px solid var(--line);
      padding: 16px 20px;
      position: sticky;
      top: 58px;
      z-index: 4;
      backdrop-filter: blur(12px);
    }
    .save-state {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
    }
    .save-state.dirty { background: #fff8e7; border-color: rgba(184,117,18,.28); color: #8a5c10; }
    .section { display: grid; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: var(--shadow); }
    .section.settlement-paid { background: #f1fbf4; border-color: rgba(45, 133, 80, .28); }
    .section.settlement-partial { background: #fff9eb; border-color: rgba(184, 117, 18, .32); }
    .section.settlement-unpaid { background: #fff2f1; border-color: rgba(183, 71, 66, .28); }
    .subsection { display: grid; gap: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .primary-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: stretch; }
    .primary-fields { display: grid; gap: 12px; }
    .primary-photo-block { display: grid; gap: 10px; align-content: start; }
    .photo-upload-hint {
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }
    .photo-upload-hint.error { color: var(--danger); }
    .photo-preview {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--soft);
      display: block;
    }
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }
    .file-button input { display: none; }
    .mini-block { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); padding: 12px; }
    .mini-title { color: var(--muted); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
    .date-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .date-item { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 8px 10px; min-height: 58px; }
    .date-item span { display: block; color: var(--muted); font-size: 12px; font-weight: 750; margin-bottom: 4px; }
    .date-item strong { display: block; font-size: 14px; line-height: 1.15; overflow-wrap: anywhere; }
    .text-block { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 12px; display: grid; gap: 6px; }
    .text-block.owner-note { background: #f6fbf9; border-color: rgba(23, 115, 102, .28); }
    .text-block.workshop-note { background: #f7f5ff; border-color: rgba(117, 94, 166, .28); }
    .text-block.correction-note { background: #fff7fb; border-color: rgba(180, 88, 145, .28); }
    .text-block.link-note { background: #fff7fb; border-color: rgba(180, 88, 145, .28); }
    .text-block span { color: var(--muted); font-size: 13px; font-weight: 750; }
    .text-block p { font-size: 15px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .text-block a { color: #177366; font-weight: 850; overflow-wrap: anywhere; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .check-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .pay-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 1.2fr; gap: 12px; }
    .stat.total { background: #f3edff; border-color: #cdbbeb; }
    .stat.total strong { color: #67419f; }
    .chat { display: grid; gap: 10px; max-width: 850px; }
    .comment { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 12px; display: grid; gap: 8px; }
    .comment-head { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .table-row { display: grid; grid-template-columns: minmax(260px, 1.4fr) minmax(130px, .75fr) minmax(150px, .8fr) minmax(130px, .75fr) 154px; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .table-row.backup-row { grid-template-columns: minmax(150px, .8fr) minmax(220px, 1.4fr) minmax(90px, .5fr) minmax(90px, .5fr) minmax(120px, .6fr) minmax(130px, .7fr); }
    .table-row.workshop-pay-row { grid-template-columns: minmax(150px, .9fr) minmax(95px, .55fr) minmax(85px, .45fr) minmax(105px, .55fr) minmax(105px, .55fr) minmax(135px, .75fr) minmax(135px, .7fr) 142px; }
    .table-row.workshop-pay-row.limited { grid-template-columns: minmax(160px, 1fr) minmax(95px, .6fr) minmax(90px, .5fr) minmax(105px, .55fr) minmax(170px, 1fr) minmax(140px, .75fr) 142px; }
    .table-row-action { min-height: 40px; display: flex; justify-content: flex-end; align-items: center; }
    .table-row-action button { width: 100%; }
    .history-row { display: grid; grid-template-columns: 150px 1fr 160px; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .history-row small { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin-top: 4px; overflow-wrap: anywhere; }
    .access-row { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr 1fr 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(23, 31, 28, .45); display: grid; place-items: center; padding: 20px; }
    .modal { width: min(620px, 100%); background: #fff; border-radius: 8px; border: 1px solid var(--line); box-shadow: 0 26px 80px rgba(0,0,0,.22); padding: 18px; display: grid; gap: 14px; }
    .photo-modal {
      position: relative;
      width: min(94vw, 980px);
      height: min(94vh, 980px);
      display: grid;
      place-items: center;
    }
    .photo-modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 26px 80px rgba(0,0,0,.32);
      background: #fff;
    }
    .photo-modal button {
      position: absolute;
      top: 10px;
      right: 10px;
      min-width: 42px;
      min-height: 42px;
      border-color: rgba(255,255,255,.45);
      background: rgba(255,255,255,.92);
    }
    .empty { padding: 28px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; background: rgba(255,255,255,.55); }
    .sync-warning { border-color: rgba(183,71,66,.35); background: #fff0ee; color: #7e2722; }
    .welcome-panel {
      overflow: hidden;
      position: relative;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr);
      align-items: stretch;
    }
    .welcome-copy { display: grid; gap: 10px; align-content: center; }
    .welcome-copy h2 { font-size: 28px; }
    .focus-strip { display: flex; flex-wrap: wrap; gap: 8px; }
    .focus-card {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 8px;
      align-content: start;
    }
    .focus-card strong { font-size: 15px; }
    .mood-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      min-height: 150px;
    }
    .mood-tile {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      min-height: 82px;
      display: grid;
      place-items: end start;
      padding: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .mood-tile:nth-child(1) { background: #f6fbf9; border-color: rgba(23,115,102,.23); }
    .mood-tile:nth-child(2) { background: #fff9ec; border-color: rgba(184,117,18,.24); }
    .mood-tile:nth-child(3) { background: #f7f2fb; border-color: rgba(103,65,159,.22); }
    .mood-tile:nth-child(4) { background: #f5f2ec; }
    .mood-tile:nth-child(5) { background: #eef4fa; border-color: rgba(70,100,145,.2); }
    .mood-tile:nth-child(6) { background: #fbf4f3; border-color: rgba(183,71,66,.2); }

    @media (max-width: 980px) {
      .login-card, .grid, .grid.three, .grid.four, .stat-grid, .card-grid, .table-row, .table-row.backup-row, .table-row.workshop-pay-row, .history-row, .access-row, .pay-summary { grid-template-columns: 1fr; }
      .link-row { grid-template-columns: 1fr; }
      .welcome-panel { grid-template-columns: 1fr; }
      .primary-layout { grid-template-columns: 1fr; }
      .photo-preview { max-width: 280px; }
      .primary-row { grid-template-columns: 1fr; }
      .date-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .span-2, .span-3, .span-4 { grid-column: auto; }
      .session-bar, .toolbar { align-items: stretch; flex-direction: column; }
      .detail-head { top: 0; }
    }

    @media (max-width: 720px) {
      h1 { font-size: 25px; }
      h2 { font-size: 21px; }
      h3 { font-size: 15px; }
      button, .file-button { width: 100%; min-height: 42px; }
      .photo-open-control { width: 34px; min-height: 34px; }
      .login-screen { padding: 12px; place-items: start center; }
      .login-card, .quick-logins { grid-template-columns: 1fr; }
      .login-brand { min-height: 300px; }
      .atelier-board { min-height: 120px; }
      .material-swatch.tall { min-height: 112px; }
      .material-swatch.mid { min-height: 96px; }
      .material-swatch.short { min-height: 72px; }
      .welcome-copy h2 { font-size: 23px; }
      .mood-board { grid-template-columns: repeat(2, 1fr); min-height: auto; }
      .panel, .section { padding: 14px; gap: 12px; }
      .workspace { padding: 12px; gap: 12px; }
      .session-bar {
        position: static;
        padding: 10px 12px;
        align-items: stretch;
        flex-direction: column;
      }
      .session-bar .row,
      .main-nav,
      .statusline,
      .tabs,
      .actions,
      .filters {
        align-items: stretch;
        flex-wrap: wrap;
      }
      .main-nav button,
      .tabs button,
      .filters button {
        width: auto;
        flex: 1 1 auto;
      }
      .detail-head {
        position: static;
        padding: 12px;
        gap: 10px;
      }
      .detail-head .toolbar > div:first-child { display: grid; gap: 6px; }
      .detail-head .actions button,
      .modal .actions button { width: 100%; }
      .statusline .pill,
      .tabs .tab {
        white-space: normal;
        justify-content: center;
        text-align: center;
      }
      .card-grid { gap: 10px; }
      .model-card {
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 8px 10px;
        min-height: auto;
        padding: 12px;
      }
      .model-card .model-photo,
      .model-card .model-photo-placeholder {

<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <section class="panel login-panel login-brand">
        <div class="brand-stack">
          <span class="brand-kicker">Fashion development CRM</span>
          <h1>CRM моделей одежды</h1>
          <p class="muted">Тихое рабочее пространство для моделей, лекал, образцов, корректировок и градации.</p>
        </div>
        <div class="atelier-board" aria-hidden="true">
          <div class="material-swatch tall">Лекала</div>
          <div class="material-swatch short">Образцы</div>
          <div class="material-swatch mid">Градация</div>
        </div>
      </section>
      <section class="panel login-panel">
        <h2>Вход</h2>
        <p class="muted">Зайдите под своим доступом, чтобы увидеть только свои задачи и модели.</p>

  <div class="app-shell hidden" id="appShell">
    <div class="session-bar">
      <div class="row">
        <span class="pill" id="sessionName"></span>
        <span class="pill" id="sessionRole"></span>
      </div>
      <div class="main-nav" id="mainNav"></div>
      <button id="logoutButton">Выйти</button>
    </div>
    <main id="app"></main>
  </div>

  <div class="modal-backdrop hidden" id="modalRoot"></div>

  <script>
    const storeKey = "fashion-crm-local-v3";
    const preRemoteBackupKey = `${storeKey}-before-supabase`;
    const supabaseConfig = {
      url: "__SUPABASE_URL__",
      anonKey: "__SUPABASE_ANON_KEY__"
    };
    let remoteReady = false;
    let remoteLoaded = false;
    let remoteError = "";
    let remoteSaveTimer = null;
    let remoteUpdatedAt = "";
    let lastCloudBackupAt = 0;
    let cloudBackupsRequested = false;
    let localChangedBeforeRemoteLoad = false;
    let remoteSaveInProgress = false;
    let remoteSaveQueued = false;
    let remoteBaselineShared = null;
    let accessDraft = null;
    let initialRouteConsumed = false;
    let saveStatus = "idle";
    let saveStatusText = "";
    let searchRenderTimer = null;
    let loginNotice = "";
    const unsavedModelIds = new Set();
    const cloudBackupIntervalMs = 120000;
    const roles = ["Админ", "Владелец бренда/Дизайнер", "Цех", "Конструктор"];
    const users = [
      { id: "u-admin", name: "Админ", login: "admin", email: "admin@fashion-crm.local", password: "admin", role: "Админ", active: true },
      { id: "u-owner", name: "Владелец / дизайнер", login: "owner", email: "owner@fashion-crm.local", password: "owner", role: "Владелец бренда/Дизайнер", active: true },
      { id: "u-workshop", name: "Цех", login: "workshop", email: "workshop@fashion-crm.local", password: "workshop", role: "Цех", active: true },
      { id: "u-constructor", name: "Конструктор", login: "constructor", email: "constructor@fashion-crm.local", password: "constructor", role: "Конструктор", active: true }
    ];
    const baseTabs = ["Основная", "Комментарии", "Оплата конструктора", "Оплата и расход цеха", "История", "Статистика"];
    const statusList = [
      "Черновик", "Новая модель", "Разработка лекал", "Лекала в работе", "Лекала готовы",
      "Передано на градацию", "Градация в работе", "Градация готова", "Завершено", "Удалено из разработки"
    ];
    const today = () => new Date().toISOString().slice(0, 10);
    const addDays = days => { const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); };
    const nowText = () => new Date().toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
    const formatDateTime = value => value ? new Date(value).toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" }) : "-";
    const uid = () => Math.random().toString(36).slice(2, 10);

    const seed = {
      currentUserId: "",
      view: "dashboard",
      allFilter: "process",
      allResponsibleFilter: "",
      allSearch: "",
      constructorSettlementUserId: "",
      statsPeriod: "month",
      activeModelId: "",
      activeTab: "Основная",
      cloudBackups: [],
      cloudBackupError: "",
      syncConflict: false,
      conflictNotice: "",
      loginEvents: [],
      systemEvents: [],
      telegramReminderLog: [],
      telegramDigestLog: [],
      users,
      models: [
        makeModel({ id: "m-draft", title: "Платье-комбинация", article: "DR-014", status: "Черновик", responsible: "u-owner", deadline: addDays(3), samples: [], corrections: [], unread: { "u-owner": 1 } }),
        makeModel({ id: "m-pattern", title: "Жакет прямого силуэта", article: "JK-001", status: "Лекала в работе", responsible: "u-constructor", deadline: addDays(4), pattern: { sentAt: today(), acceptedAt: today(), deadline: addDays(4), checklist: blankChecklist(), readyAt: "", cost: 0 }, participants: ["u-owner", "u-constructor"] }),
        makeModel({ id: "m-sample", title: "Юбка миди", article: "SK-022", status: "Образец 1 в работе", responsible: "u-workshop", deadline: addDays(2), samples: [sample(1, { status: "Образец 1 в работе", sentAt: today(), acceptedAt: today(), deadline: addDays(2), ownerComment: "Проверить посадку по талии." })], participants: ["u-owner", "u-constructor", "u-workshop"] }),
        makeModel({ id: "m-owner", title: "Брюки палаццо", article: "TR-008", status: "Образец 1 готов", responsible: "u-owner", deadline: addDays(1), samples: [sample(1, { status: "Образец 1 готов", sentAt: today(), acceptedAt: today(), deadline: today(), readyAt: today(), workshopComment: "Образец готов, посадка свободная.", fabricUsage: 2.1, cost: 1700 })], participants: ["u-owner", "u-constructor", "u-workshop"] }),
        makeModel({ id: "m-grade", title: "Рубашка oversize", article: "SH-031", status: "Градация готова", responsible: "u-owner", deadline: today(), grading: { finalName: "Рубашка oversize SH-031", sizes: "XS-XL", comment: "Градация по базовой сетке.", extraComment: "Проверить длину рукава.", sentAt: today(), acceptedAt: today(), deadline: today(), readyAt: today(), checklist: { notches: true, printDetails: true, nameUpdated: true, sentTelegram: true }, cost: 4200 }, participants: ["u-owner", "u-constructor"] })
      ]
    };

    function makeModel(overrides = {}) {
      const model = {
        id: uid(),
        brand: "Не определились",
        photoDataUrl: "",
        title: "Новая модель",
        article: "",
        sizeRange: "XS-L",
        material: "",
        hardware: "",
        fabricMeterPrice: 0,
        liningMeterPrice: 0,
        description: "",
        important: "",
        gradingComment: "",
        links: [""],
        status: "Черновик",
        currentResponsibleUserId: "u-owner",
        deadline: "",
        createdByUserId: "u-owner",
        ownerUserId: "u-owner",
        constructorUserId: "u-constructor",
        workshopUserId: "u-workshop",
        participants: ["u-owner"],
        createdAt: today(),
        updatedAt: today(),
        deletedReason: "",
        unread: {},
        pattern: { sentAt: "", acceptedAt: "", deadline: "", readyAt: "", checklist: blankChecklist(), cost: 0 },
        samples: [],
        corrections: [],
        grading: { finalName: "", sizes: "", comment: "", extraComment: "", sentAt: "", acceptedAt: "", deadline: "", readyAt: "", checklist: { notches: false, printDetails: false, nameUpdated: false, sentTelegram: false }, cost: 0 },
        payments: {
          constructor: [
            { id: uid(), work: "Разработка лекал", amount: 0, paid: false, paidAt: "" },
            { id: uid(), work: "Градация", amount: 0, paid: false, paidAt: "" }
          ]
        },
        comments: [],
        history: [{ date: nowText(), user: "Система", action: "Создана карточка модели" }]
      };
      return { ...model, ...overrides };
    }

    function blankChecklist() {
      return { notches: false, printDetails: false, signed: false };
    }

    function sample(number, overrides = {}) {
      return {
        id: uid(), number, status: `Отшив образца ${number}`, sentAt: "", acceptedAt: "",
        deadline: "", readyAt: "", ownerComment: "", workshopComment: "", usedHardware: "",
        fabricUsage: 0, liningUsage: 0, cost: 0, paid: false, paidAt: "", ...overrides
      };
    }

    function correction(number, overrides = {}) {
      return {
        id: uid(), number, status: `Поданы корректировки ${number}`, text: "", link: "",
        sentAt: today(), acceptedAt: "", deadline: "", readyAt: "",
        checklist: blankChecklist(), printCost: 0, ...overrides
      };
    }

    let state = load();

    function load() {
      let data;
      try { data = JSON.parse(localStorage.getItem(storeKey)) || structuredClone(seed); }
      catch { data = structuredClone(seed); }
      return normalizeStateData(data);
    }

    function normalizeStateData(data) {
      data.statsPeriod = data.statsPeriod || "month";
      data.allResponsibleFilter = data.allResponsibleFilter || "";
      data.allSearch = data.allSearch || "";
      data.constructorSettlementUserId = data.constructorSettlementUserId || "";
      data.cloudBackups = data.cloudBackups || [];
      data.cloudBackupError = data.cloudBackupError || "";
      data.syncConflict = !!data.syncConflict;
      data.conflictNotice = data.conflictNotice || "";
      data.loginEvents = data.loginEvents || [];
      data.systemEvents = data.systemEvents || [];
      data.telegramReminderLog = data.telegramReminderLog || [];
      data.telegramDigestLog = data.telegramDigestLog || [];
      data.users = normalizeUsers(data.users || []);
      (data.models || []).forEach(model => {
        model.brand = model.brand || "Не определились";
        model.photoDataUrl = model.photoDataUrl || "";
        model.fabricMeterPrice = Number(model.fabricMeterPrice || 0);
        model.liningMeterPrice = Number(model.liningMeterPrice || 0);
        (model.samples || []).forEach(s => s.liningUsage = Number(s.liningUsage || 0));
        (model.samples || []).forEach(s => s.usedHardware = s.usedHardware || "");
        (model.corrections || []).forEach(c => {
          c.printCost = Number(c.paperCost ?? c.printCost ?? 0);
          c.paperCost = c.printCost;
          c.paperPaid = !!c.paperPaid;
          c.paperPaidAt = c.paperPaidAt || "";
        });
      });
      cleanupTechnicalHistory(data);
      return data;
    }

    function cleanupTechnicalHistory(data) {
      (data.models || []).forEach(model => {
        model.history = (model.history || []).filter(item => !isTechnicalHistory(item));
      });
    }

    function isTechnicalHistory(item) {
      const action = item?.action || "";
      return action.includes('"newComment"') || action.includes('"newUser') || action.includes('"link:');
    }

    function hasSupabase() {
      return supabaseConfig.url.startsWith("http") && supabaseConfig.anonKey && !supabaseConfig.anonKey.includes("__");
    }

    async function supabaseRequest(path, options = {}) {
      const headers = {
        apikey: supabaseConfig.anonKey,
        authorization: `Bearer ${supabaseConfig.anonKey}`,
        "content-type": "application/json",
        ...(options.headers || {})
      };
      const response = await fetch(`${supabaseConfig.url.replace(/\/$/, "")}${path}`, { ...options, headers });
      if (!response.ok) {
        const detail = await response.text();
        const error = new Error(`Supabase ${response.status}: ${detail || response.statusText}`);
        error.status = response.status;
        throw error;
      }
      if (response.status === 204) return null;
      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    function supabaseErrorLabel(error) {
      if (error?.status) return `Supabase ${error.status}`;
      const message = String(error?.message || "");
      if (message.includes("Failed to fetch")) return "Supabase: сеть";
      return "Supabase недоступен";
    }

    function setSaveStatus(status, text = "") {
      saveStatus = status;
      saveStatusText = text;
      updateGlobalSaveState();
    }

    function saveStatusLabel() {
      if (saveStatus === "saving") return saveStatusText || "Сохраняю...";
      if (saveStatus === "error") return saveStatusText || "Не сохранено";
      if (saveStatus === "conflict") return "Есть новая версия";
      return "Все сохранено";
    }

    function saveStatusClass() {
      if (saveStatus === "error" || saveStatus === "conflict") return "danger";
      if (saveStatus === "saving") return "warn";
      return "ok";
    }

    function updateGlobalSaveState() {
      const el = document.getElementById("globalSaveState");
      if (!el) return;
      el.className = `pill ${saveStatusClass()}`;
      el.textContent = saveStatusLabel();
    }

    function forceLogoutForDatabase(reason = "CRM не подключена к онлайн-базе. Вход временно закрыт.") {
      loginNotice = reason;
      state.currentUserId = "";
      state.activeModelId = "";
      state.view = "dashboard";
      localStorage.setItem(storeKey, JSON.stringify(state));
      render();
    }

    function addSystemEvent(level, title, detail = "") {
      state.systemEvents = state.systemEvents || [];
      state.systemEvents.unshift({
        id: uid(),
        at: new Date().toISOString(),
        level,
        title,
        detail: String(detail || "").slice(0, 500),
        userId: currentUser()?.id || "",
        userName: currentUser()?.name || ""
      });
      state.systemEvents = state.systemEvents.slice(0, 120);
      localStorage.setItem(storeKey, JSON.stringify(state));
      if (remoteReady && remoteLoaded && !unsavedModelIds.size) queueRemoteSave();
    }

    async function initRemoteState() {
      if (!hasSupabase()) return;
      try {
        setSaveStatus("saving", "Подключение...");
        const rows = await supabaseRequest("/rest/v1/crm_state?id=eq.main&select=data,updated_at");
        if (Array.isArray(rows) && rows[0]?.data) {
          backupSharedState(preRemoteBackupKey, "Локальная копия до загрузки Supabase");
          const remoteState = normalizeStateData({ ...structuredClone(seed), ...rows[0].data });
          state = normalizeStateData({ ...structuredClone(seed), ...remoteState, ...localUiState() });
          remoteBaselineShared = pickSharedData(state);
          remoteUpdatedAt = rows[0].updated_at || "";
          localStorage.setItem(storeKey, JSON.stringify(state));
        } else {
          await saveRemoteNow();
        }
        remoteReady = true;
        remoteLoaded = true;
        remoteError = "";
        state.syncConflict = false;
        localChangedBeforeRemoteLoad = false;
        setSaveStatus("saved");
        runTelegramAutomations();
        render();
      } catch (error) {
        remoteReady = false;
        remoteLoaded = false;
        remoteError = supabaseErrorLabel(error);
        setSaveStatus("error", remoteError);
        addSystemEvent("error", "Supabase недоступен при загрузке", error.message || remoteError);
        console.warn("Supabase sync failed", error);
        forceLogoutForDatabase(`CRM не подключена к онлайн-базе (${remoteError}). Вход временно закрыт, чтобы данные не потерялись.`);
      }
    }

    function persist() {
      localStorage.setItem(storeKey, JSON.stringify(state));
      if (unsavedModelIds.size) return;
      if (remoteReady && remoteLoaded) queueRemoteSave();
    }

    function canWriteSharedData() {
      return !hasSupabase() || (remoteReady && remoteLoaded && !remoteSaveInProgress);
    }

    function requireOnlineWrite() {
      if (canWriteSharedData()) return true;
      alert("Онлайн-база еще не готова или временно недоступна. Обновите страницу или попробуйте через несколько секунд. Действие не сохранено локально.");
      return false;
    }

    async function ensureOnlineWrite(actionName = "действие") {
      if (!requireOnlineWrite()) return false;
      if (!hasSupabase()) return true;
      try {
        setSaveStatus("saving", "Проверяю базу...");
        await supabaseRequest("/rest/v1/crm_state?id=eq.main&select=updated_at");
        setSaveStatus("saved");
        return true;
      } catch (error) {
        remoteReady = false;
        remoteError = supabaseErrorLabel(error);
        setSaveStatus("error", remoteError);
        addSystemEvent("error", `Не удалось выполнить: ${actionName}`, error.message || remoteError);
        forceLogoutForDatabase(`Связь с онлайн-базой потеряна (${remoteError}). CRM завершила сессию, чтобы данные не потерялись.`);
        return false;
      }
    }

    async function saveSharedChangesOrThrow() {
      localStorage.setItem(storeKey, JSON.stringify(state));
      if (hasSupabase()) {
        if (!remoteReady || !remoteLoaded) throw new Error("Remote database is not ready");
        await saveRemoteNow();
      }
    }

    function queueRemoteSave() {
      clearTimeout(remoteSaveTimer);
      remoteSaveTimer = setTimeout(() => {
        saveRemoteNow().catch(error => {
          remoteReady = false;
          remoteError = state.syncConflict ? "Есть новая версия в Supabase" : "Не сохранено в Supabase";
          setSaveStatus(state.syncConflict ? "conflict" : "error", remoteError);
          addSystemEvent("error", "Фоновое сохранение не прошло", error.message || remoteError);
          console.warn("Supabase save failed", error);
          forceLogoutForDatabase(`Связь с онлайн-базой потеряна (${remoteError}). CRM завершила сессию, чтобы данные не потерялись.`);
        });
      }, 500);
    }

    async function saveRemoteNow() {
      if (!hasSupabase()) return;
      if (remoteSaveInProgress) {
        remoteSaveQueued = true;
        return;
      }
      remoteSaveInProgress = true;
      setSaveStatus("saving", "Сохраняю...");
      try {
        backupSharedState(`${storeKey}-last-cloud-save`, "Копия перед записью в Supabase");
        const remoteRow = await fetchRemoteStateRow();
        let dataToSave = sharedState();
        let conflictNames = [];
        if (remoteRow?.data && remoteUpdatedAt && remoteRow.updated_at && remoteRow.updated_at !== remoteUpdatedAt) {
          const merged = mergeConcurrentState(remoteRow.data, dataToSave, remoteBaselineShared);
          dataToSave = merged.data;
          conflictNames = merged.conflicts.map(id => modelTitleById(id, dataToSave)).filter(Boolean);
          const notice = conflictNames.length ? `Заявка уже отредактирована другим пользователем: ${conflictNames.join(", ")}. Ваши правки по этой заявке не сохранены.` : "";
          state = normalizeStateData({ ...state, ...dataToSave, syncConflict: merged.conflicts.length > 0, conflictNotice: notice });
          remoteError = notice || "";
          if (notice) addSystemEvent("warn", "Конфликт правок", notice);
          localStorage.setItem(storeKey, JSON.stringify(state));
        }
        if (!conflictNames.length) {
          state.syncConflict = false;
          state.conflictNotice = "";
          remoteError = "";
        }
        const rows = await supabaseRequest("/rest/v1/crm_state?on_conflict=id&select=updated_at", {
          method: "POST",
          headers: { Prefer: "resolution=merge-duplicates,return=representation" },
          body: JSON.stringify({ id: "main", data: dataToSave, updated_at: new Date().toISOString() })
        });
        remoteUpdatedAt = Array.isArray(rows) ? rows[0]?.updated_at || remoteUpdatedAt : remoteUpdatedAt;
        remoteBaselineShared = structuredClone(dataToSave);
        remoteReady = true;
        remoteLoaded = true;
        setSaveStatus(conflictNames.length ? "conflict" : "saved");
        localStorage.setItem(storeKey, JSON.stringify(state));
        if (conflictNames.length) {
          render();
          alert(state.conflictNotice);
        }
        createCloudBackup("Автокопия текущей версии CRM", { data: dataToSave }).catch(error => {
          state.cloudBackupError = "Автокопия не создалась. Проверьте таблицу crm_backups в Supabase.";
          localStorage.setItem(storeKey, JSON.stringify(state));
          addSystemEvent("warn", "Автокопия не создалась", error.message || state.cloudBackupError);
          console.warn("Cloud backup failed", error);
        });
      } finally {
        remoteSaveInProgress = false;
        if (remoteSaveQueued) {
          remoteSaveQueued = false;
          queueRemoteSave();
        }
      }
    }

    async function fetchRemoteStateRow() {
      const rows = await supabaseRequest("/rest/v1/crm_state?id=eq.main&select=data,updated_at");
      return Array.isArray(rows) ? rows[0] || null : null;
    }

    async function loadLatestRemoteState() {
      if (!hasSupabase()) return;
      const rows = await supabaseRequest("/rest/v1/crm_state?id=eq.main&select=data,updated_at");
      if (!Array.isArray(rows) || !rows[0]?.data) return;
      backupSharedState(preRemoteBackupKey, "Локальная копия до ручной загрузки Supabase");
      state = normalizeStateData({ ...structuredClone(seed), ...rows[0].data, ...localUiState(), syncConflict: false, conflictNotice: "" });
      remoteUpdatedAt = rows[0].updated_at || "";
      remoteBaselineShared = pickSharedData(state);
      remoteReady = true;
      remoteLoaded = true;
      remoteError = "";
      localStorage.setItem(storeKey, JSON.stringify(state));
      render();
    }

    async function createCloudBackup(reason, options = {}) {
      if (!hasSupabase()) return false;
      const force = !!options.force;
      const now = Date.now();
      if (!force && now - lastCloudBackupAt < cloudBackupIntervalMs) return false;
      let data = options.data || null;
      if (!data) {
        const rows = await supabaseRequest("/rest/v1/crm_state?id=eq.main&select=data");
        data = Array.isArray(rows) ? rows[0]?.data : null;
      }
      if (!data?.users || !data?.models) return false;
      await supabaseRequest("/rest/v1/crm_backups", {
        method: "POST",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify({ reason, data })
      });
      lastCloudBackupAt = now;
      state.cloudBackupError = "";
      localStorage.setItem(storeKey, JSON.stringify(state));
      pruneCloudBackups().catch(error => console.warn("Cloud backup prune failed", error));
      return true;
    }

    async function loadCloudBackups() {
      if (!hasSupabase()) return;
      try {
        const rows = await supabaseRequest("/rest/v1/crm_backups?select=id,reason,created_at,data&order=created_at.desc&limit=20");
        state.cloudBackups = Array.isArray(rows) ? rows : [];
        state.cloudBackupError = "";
        localStorage.setItem(storeKey, JSON.stringify(state));
      } catch (error) {
        state.cloudBackups = [];
        state.cloudBackupError = "Облачные копии пока недоступны. Проверьте, что SQL для crm_backups выполнен в Supabase.";
        console.warn("Cloud backups load failed", error);
      }
    }

    async function pruneCloudBackups() {
      const rows = await supabaseRequest("/rest/v1/crm_backups?select=id&order=created_at.desc&offset=20");
      if (!Array.isArray(rows) || !rows.length) return;
      const ids = rows.map(row => row.id).filter(Boolean).join(",");
      if (!ids) return;
      await supabaseRequest(`/rest/v1/crm_backups?id=in.(${ids})`, { method: "DELETE" });
    }

    function sharedState() {

        users: state.users,

    function pickSharedData(source) {
      return {
        users: structuredClone(source.users || []),
        models: structuredClone(source.models || []),
        loginEvents: structuredClone(source.loginEvents || []),
        systemEvents: structuredClone(source.systemEvents || []),
        telegramReminderLog: structuredClone(source.telegramReminderLog || []),
        telegramDigestLog: structuredClone(source.telegramDigestLog || [])
      };
    }

    function mergeSharedData(remoteData, localData) {
      const localModels = localData.models || [];
      const remoteModels = remoteData.models || [];
      const modelsById = new Map(remoteModels.map(model => [model.id, model]));
      localModels.forEach(model => {
        const remoteModel = modelsById.get(model.id);
        if (!remoteModel || model.status === "Черновик") modelsById.set(model.id, model);
      });
      const usersById = new Map((remoteData.users || []).map(user => [user.id, user]));
      (localData.users || []).forEach(user => {
        if (!usersById.has(user.id)) usersById.set(user.id, user);
      });
      const loginEventsById = new Map();
      [...(localData.loginEvents || []), ...(remoteData.loginEvents || [])].forEach(event => {
        if (event?.id && !loginEventsById.has(event.id)) loginEventsById.set(event.id, event);
      });
      return {
        users: Array.from(usersById.values()),
        models: Array.from(modelsById.values()).sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || ""))),
        loginEvents: Array.from(loginEventsById.values()).sort((a, b) => String(b.at || "").localeCompare(String(a.at || ""))).slice(0, 200),
        systemEvents: mergeSystemEvents(remoteData.systemEvents || [], localData.systemEvents || []),
        telegramReminderLog: mergeUniqueStrings(remoteData.telegramReminderLog || [], localData.telegramReminderLog || []),
        telegramDigestLog: mergeUniqueStrings(remoteData.telegramDigestLog || [], localData.telegramDigestLog || [])
      };
    }

    function mergeConcurrentState(remoteData, localData, baselineData) {
      const baselineModels = new Map((baselineData?.models || []).map(model => [model.id, model]));
      const remoteModels = new Map((remoteData.models || []).map(model => [model.id, model]));
      const localModels = new Map((localData.models || []).map(model => [model.id, model]));
      const modelIds = new Set([...baselineModels.keys(), ...remoteModels.keys(), ...localModels.keys()]);
      const conflicts = [];
      const models = [];
      modelIds.forEach(id => {
        const base = baselineModels.get(id);
        const remote = remoteModels.get(id);
        const local = localModels.get(id);
        const localChanged = !sameData(local, base);
        const remoteChanged = !sameData(remote, base);
        if (local && remote && localChanged && remoteChanged) {
          conflicts.push(id);
          models.push(remote);
        } else if (local && localChanged) {
          models.push(local);
        } else if (remote) {
          models.push(remote);
        } else if (local) {
          models.push(local);
        }
      });
      return {
        conflicts,
        data: {
          users: mergeUsersForConcurrentSave(remoteData.users || [], localData.users || [], baselineData?.users || []),
          models: models.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || ""))),
          loginEvents: mergeLoginEvents(remoteData.loginEvents || [], localData.loginEvents || []),
          systemEvents: mergeSystemEvents(remoteData.systemEvents || [], localData.systemEvents || []),
          telegramReminderLog: mergeUniqueStrings(remoteData.telegramReminderLog || [], localData.telegramReminderLog || []),
          telegramDigestLog: mergeUniqueStrings(remoteData.telegramDigestLog || [], localData.telegramDigestLog || [])
        }
      };
    }

    function mergeUsersForConcurrentSave(remoteUsers, localUsers, baselineUsers) {
      const baseline = new Map(baselineUsers.map(user => [user.id, user]));
      const remote = new Map(remoteUsers.map(user => [user.id, user]));
      const local = new Map(localUsers.map(user => [user.id, user]));
      const ids = new Set([...baseline.keys(), ...remote.keys(), ...local.keys()]);
      return Array.from(ids).map(id => {
        const baseUser = baseline.get(id);
        const remoteUser = remote.get(id);
        const localUser = local.get(id);
        const localChanged = !sameData(localUser, baseUser);
        const remoteChanged = !sameData(remoteUser, baseUser);
        if (localUser && localChanged && !remoteChanged) return localUser;
        return remoteUser || localUser;
      }).filter(Boolean);
    }

    function mergeLoginEvents(remoteEvents, localEvents) {
      const byId = new Map();
      [...localEvents, ...remoteEvents].forEach(event => {
        if (event?.id && !byId.has(event.id)) byId.set(event.id, event);
      });
      return Array.from(byId.values()).sort((a, b) => String(b.at || "").localeCompare(String(a.at || ""))).slice(0, 200);
    }

    function mergeSystemEvents(remoteEvents, localEvents) {
      const byId = new Map();
      [...localEvents, ...remoteEvents].forEach(event => {
        if (event?.id && !byId.has(event.id)) byId.set(event.id, event);
      });
      return Array.from(byId.values()).sort((a, b) => String(b.at || "").localeCompare(String(a.at || ""))).slice(0, 120);
    }

    function mergeUniqueStrings(a = [], b = []) {
      return [...new Set([...a, ...b].filter(Boolean))].slice(-500);
    }

    function modelTitleById(id, data = sharedState()) {
      const model = (data.models || []).find(item => item.id === id);
      if (!model) return id;
      return `${model.title || "Без названия"}${model.article ? ` · ${model.article}` : ""}`;
    }

    function sameData(a, b) {
      return stableStringify(a || null) === stableStringify(b || null);
    }

    function stableStringify(value) {
      if (Array.isArray(value)) return `[${value.map(stableStringify).join(",")}]`;
      if (value && typeof value === "object") {
        return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${stableStringify(value[key])}`).join(",")}}`;
      }
      return JSON.stringify(value);
    }

    function backupSharedState(key, reason) {
      try {
        localStorage.setItem(key, JSON.stringify({
          reason,
          createdAt: new Date().toISOString(),
          data: sharedState()
        }));
      } catch (error) {
        console.warn("Backup failed", error);
      }
    }

    function readBackup(key) {
      try { return JSON.parse(localStorage.getItem(key) || "null"); }
      catch { return null; }
    }

    function applySharedData(data) {
      if (!data?.users || !data?.models) return false;
      state = normalizeStateData({
        ...state,
        users: data.users,
        models: data.models,
        loginEvents: data.loginEvents || state.loginEvents || [],
        systemEvents: data.systemEvents || state.systemEvents || [],
        telegramReminderLog: data.telegramReminderLog || state.telegramReminderLog || [],
        telegramDigestLog: data.telegramDigestLog || state.telegramDigestLog || []
      });
      persist();
      return true;
    }

    function restoreSharedDataLocally(data) {
      if (!data?.users || !data?.models) return false;
      state = normalizeStateData({
        ...state,
        users: data.users,
        models: data.models,
        loginEvents: data.loginEvents || state.loginEvents || [],
        systemEvents: data.systemEvents || state.systemEvents || [],
        telegramReminderLog: data.telegramReminderLog || state.telegramReminderLog || [],
        telegramDigestLog: data.telegramDigestLog || state.telegramDigestLog || []
      });
      localStorage.setItem(storeKey, JSON.stringify(state));
      return true;
    }

    localStorage.setItem(storeKey, JSON.stringify(state));
    function currentUser() { return state.users.find(u => u.id === state.currentUserId) || null; }
    function currentModel() { return state.models.find(m => m.id === state.activeModelId) || null; }
    function userName(id) { return state.users.find(u => u.id === id)?.name || "Не назначен"; }
    function roleOf(id) { return normalizeRole(state.users.find(u => u.id === id)?.role || ""); }
    function isAdminRole(role) { return normalizeRole(role) === "Админ"; }
    function isOwnerRole(role) { return normalizeRole(role) === "Владелец бренда/Дизайнер"; }
    function isConstructorRole(role) { return normalizeRole(role) === "Конструктор"; }
    function isWorkshopRole(role) { return normalizeRole(role) === "Цех"; }
    function isAdmin() { return isAdminRole(currentUser()?.role); }
    function isOwner() { return isOwnerRole(currentUser()?.role); }
    function canEditPrimary() { return isAdmin() || isOwner(); }
    function canPay() { return isAdmin() || isOwner(); }
    function canViewGlobalStats() { return isAdmin() || isOwner(); }
    function canViewConstructorSettlements() { return isAdmin() || isOwner(); }
    function money(v) { return Number(v || 0).toLocaleString("ru-RU") + " грн"; }
    function inProcess(m) { return !["Завершено", "Удалено из разработки"].includes(m.status); }
    function isDeleted(m) { return m.status === "Удалено из разработки"; }
    function hasAccess(m, user = currentUser()) {
      if (!user) return false;
      if (isAdminRole(user.role) || isOwnerRole(user.role)) return true;
      if (isDeleted(m)) return false;
      return m.participants.includes(user.id);
    }
    function dashboardModels() {
      const user = currentUser();
      if (!user) return [];
      return state.models.filter(m => hasAccess(m, user) && inProcess(m) && m.currentResponsibleUserId === user.id);
    }
    function allModels() {
      const query = String(state.allSearch || "").trim().toLowerCase();
      return state.models.filter(m => {
        if (!hasAccess(m)) return false;
        if (state.allResponsibleFilter && m.currentResponsibleUserId !== state.allResponsibleFilter) return false;
        if (state.allFilter === "process") return inProcess(m);
        if (state.allFilter === "archive") return !inProcess(m);
        return true;
      }).filter(m => {
        if (!query) return true;
        return [
          m.brand,
          m.title,
          m.article,
          m.status,
          m.sizeRange,
          m.material,
          m.hardware,
          userName(m.currentResponsibleUserId)
        ].some(value => String(value || "").toLowerCase().includes(query));
      });
    }
    function allowedTabs() {
      const role = normalizeRole(currentUser()?.role);
      if (isConstructorRole(role)) return ["Основная", "Комментарии", "Оплата конструктора"];
      if (isWorkshopRole(role)) return ["Основная", "Комментарии", "Оплата и расход цеха"];
      return baseTabs;
    }
    function addHistory(model, action, details = null) {
      model.history.unshift({ date: nowText(), user: currentUser()?.name || "Система", action, details });
      model.updatedAt = today();
    }
    function changeStatus(model, nextStatus, action) {
      const previousStatus = model.status;
      model.status = nextStatus;
      addHistory(model, action, previousStatus !== nextStatus ? { from: previousStatus, to: nextStatus } : null);
    }
    function historyDetails(details) {
      if (!details) return "";
      if (details.field) return `<small>${escapeHtml(details.field)}: ${escapeHtml(details.from || "-")} → ${escapeHtml(details.to || "-")}</small>`;
      if ("from" in details || "to" in details) return `<small>${escapeHtml(details.from || "-")} → ${escapeHtml(details.to || "-")}</small>`;
      return "";
    }
    function addParticipant(model, userId) {
      if (userId && !model.participants.includes(userId)) model.participants.push(userId);
    }
    function replaceParticipantByRole(model, userId, role) {
      model.participants = model.participants.filter(id => roleOf(id) !== role);
      addParticipant(model, userId);
    }
    function unreadCount(model) {
      return Number(model.unread?.[currentUser()?.id] || 0);
    }
    function deadlineState(date) {
      if (!date) return { label: "без дедлайна", cls: "" };
      const diff = Math.ceil((new Date(date) - new Date(today())) / 86400000);
      if (diff < 0) return { label: "просрочено", cls: "danger" };
      if (diff <= 1) return { label: "1 день", cls: "danger" };
      if (diff === 2) return { label: "2 дня", cls: "warn" };
      return { label: "в срок", cls: "ok" };
    }

    function correctionPrintTotal(model) {
      return (model.corrections || []).reduce((sum, c) => sum + Number(c.paperCost ?? c.printCost ?? 0), 0);
    }

    function constructorCostTotal(model) {
      return (model.payments.constructor || []).reduce((sum, p) => sum + Number(p.amount || 0), 0) + correctionPrintTotal(model);
    }

    function fabricCostForSample(model, sampleItem) {
      const mainFabricCost = Number(sampleItem.fabricUsage || 0) * Number(model.fabricMeterPrice || 0);
      const liningCost = Number(sampleItem.liningUsage || 0) * Number(model.liningMeterPrice || 0);
      return mainFabricCost + liningCost;
    }

    function fabricCostTotal(model) {
      return (model.samples || []).filter(s => s.readyAt).reduce((sum, sampleItem) => sum + fabricCostForSample(model, sampleItem), 0);
    }

    function statusClass(status) {
      const text = String(status || "").toLowerCase();
      if (text === "удалено из разработки") return "status-deleted";
      if (text === "завершено") return "status-finished";
      if (text === "черновик" || text === "новая модель") return "status-draft";
      if (text.includes("лекал")) return text.includes("готов") ? "status-ready" : "status-pattern";
      if (text.includes("образца") || text.includes("образец")) return text.includes("готов") ? "status-ready" : "status-sample";
      if (text.includes("корректиров")) return text.includes("готов") ? "status-ready" : "status-correction";
      if (text.includes("градац")) return text.includes("готов") ? "status-ready" : "status-grading";
      return "status-draft";
    }

    function statusBadge(status, extra = "") {
      return `<span class="pill status-badge ${statusClass(status)} ${extra}">${escapeHtml(status || "-")}</span>`;
    }

    function patternNameUpdatedLabel(model) {
      const name = model.grading?.finalName || model.title || "название модели";
      const article = model.article || "артикул";
      return `Название на лекалах обновлено на ${name}, ${article}`;

    function patternSignedLabel(model) {

    function render() {
      renderLogin();
      if (!currentUser()) {
        renderShell();
        return;
      }
      applyInitialModelLink();
      renderShell();
      if (state.view === "detail" && currentModel()) renderDetail();
      else renderHome();
      syncRoute();
    }

    function currentRouteParams() {
      const hash = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
      return new URLSearchParams(hash);
    }

    function applyInitialModelLink(force = false) {
      if (initialRouteConsumed && !force) return;
      const params = currentRouteParams();
      const view = params.get("view") || "";
      const id = params.get("model") || "";
      const tab = params.get("tab") || "";
      if (id) {
      const model = state.models.find(m => m.id === id);
        if (model && hasAccess(model)) {
          state.activeModelId = model.id;
          state.view = "detail";
          state.activeTab = tab || "Основная";
        }
      } else if (["dashboard", "all", "stats", "access", "constructorSettlements"].includes(view)) {
        state.view = view;
        state.activeModelId = "";
      } else if (force && !location.hash) {
        state.view = "dashboard";
        state.activeModelId = "";
      }
      initialRouteConsumed = true;
    }

    function routeUrl(params = {}) {
      const url = new URL(location.href);
      const search = new URLSearchParams();
      Object.entries(params).forEach(([key, value]) => {
        if (value) search.set(key, value);
      });
      url.hash = search.toString();
      return url.toString();
    }

    function syncRoute(replace = true) {
      if (!currentUser()) return;
      let nextUrl = "";
      if (state.view === "detail" && currentModel()) {
        nextUrl = routeUrl({ model: state.activeModelId, tab: state.activeTab && state.activeTab !== "Основная" ? state.activeTab : "" });
      } else {
        nextUrl = routeUrl({ view: state.view === "dashboard" ? "" : state.view });
      }
      if (nextUrl === location.href) return;
      history[replace ? "replaceState" : "pushState"]({}, "", nextUrl);
    }

    function copyText(text) {
      if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
      const input = document.createElement("textarea");
      input.value = text;
      input.setAttribute("readonly", "");
      input.style.position = "fixed";
      input.style.opacity = "0";
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      document.body.removeChild(input);
      return Promise.resolve();
    }
